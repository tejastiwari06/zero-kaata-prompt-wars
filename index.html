  <style>
    /* Application Shell Styling */
    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-container {

      padding: 16px 20px 40px;
      width: 100%;
      flex: 1;

      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      margin-bottom: 24px;
      gap: 16px;
      position: sticky;
      top: 12px;
      z-index: 100;
      background: rgba(15, 20, 45, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(79, 110, 247, 0.22);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

    .modal-backdrop {
      position: fixed;
      inset: 0;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 7, 18, 0.88);

      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 16px;
      overflow-y: auto;
      box-sizing: border-box;
      animation: modal-backdrop-in 0.2s ease-out;
    }

    @keyframes modal-backdrop-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      position: relative;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;

<body>
  <div id="root"></div>

  <!-- Main Game Engine Scripts & React UI Bundle -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- EMBEDDED SOUND MANAGER (Pure Web Audio API Synthesizer) ---
    class SoundManager {
      static ctx = null;
      static isMuted = false;
      static masterVolume = 0.8;
      static sfxVolume = 0.9;

      static init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        } catch (e) {}
      }

      static getVol() {
        return this.isMuted ? 0 : this.masterVolume * this.sfxVolume;
      }

      static playClick() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(this.getVol() * 0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) {}
      }

      static playMove(isX) {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isX ? 'triangle' : 'sine';
          const baseFreq = isX ? 587.33 : 440;
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.08);
          gain.gain.setValueAtTime(this.getVol() * 0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } catch (e) {}
      }

      static playWin() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          const now = this.ctx.currentTime;
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0, now + idx * 0.1);
            gain.gain.linearRampToValueAtTime(this.getVol() * 0.4, now + idx * 0.1 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.45);
          });
        } catch (e) {}
      }

      static playDraw() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          [440, 415.3, 392].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(this.getVol() * 0.25, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.35);
          });
        } catch (e) {}
      }

      static playPowerUp() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
          gain.gain.setValueAtTime(this.getVol() * 0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        } catch (e) {}
      }

      static playReaction() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.12);
          gain.gain.setValueAtTime(this.getVol() * 0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } catch (e) {}
      }

      static playError() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);

          gain.gain.setValueAtTime(this.getVol() * 0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);

    // --- GAME ENGINE RULES ---
    class GameEngine {
      static getWinningLines(size = 3, winStreak = size) {
        const lines = [];
        // Horizontal
        for (let r = 0; r < size; r++) {
          for (let c = 0; c <= size - winStreak; c++) {
            const line = [];
            for (let k = 0; k < winStreak; k++) line.push(r * size + (c + k));
            lines.push(line);
          }
        }
        // Vertical
        for (let c = 0; c < size; c++) {
          for (let r = 0; r <= size - winStreak; r++) {
            const line = [];
            for (let k = 0; k < winStreak; k++) line.push((r + k) * size + c);
            lines.push(line);
          }
        }
        // Diagonals
        for (let r = 0; r <= size - winStreak; r++) {
          for (let c = 0; c <= size - winStreak; c++) {
            const line = [];
            for (let k = 0; k < winStreak; k++) line.push((r + k) * size + (c + k));
            lines.push(line);
          }
        }
        // Anti-diagonals
        for (let r = 0; r <= size - winStreak; r++) {
          for (let c = winStreak - 1; c < size; c++) {
            const line = [];
            for (let k = 0; k < winStreak; k++) line.push((r + k) * size + (c - k));
            lines.push(line);
          }
        }
        return lines;
      }

      static checkWinner(board, size = 3, winStreak = size) {
        const lines = this.getWinningLines(size, winStreak);
        for (const line of lines) {
          const first = board[line[0]];
          if (!first) continue;
          let match = true;
          for (let i = 1; i < line.length; i++) {
            if (board[line[i]] !== first) { match = false; break; }
          }
          if (match) {
            let direction = 'horizontal';
            const [a, b] = [line[0], line[1]];
            if (Math.floor(a / size) === Math.floor(b / size)) direction = 'horizontal';
            else if (a % size === b % size) direction = 'vertical';
            else if (b - a === size + 1) direction = 'diagonal_main';
            else direction = 'diagonal_anti';
            return { winner: first, winningLine: { indices: line, direction } };
          }
        }
        return { winner: null, winningLine: null };
      }

      static isFull(board) {
        return board.every(c => c !== null);
      }

      static getLegalMoves(board, restricted = []) {
        const legal = [];
        const resSet = new Set(restricted);
        for (let i = 0; i < board.length; i++) {
          if (board[i] === null && !resSet.has(i)) legal.push(i);
        }
        return legal;
      }
    }

    // --- MINIMAX AI ENGINE (Unbeatable Alpha-Beta) ---
    class MinimaxAI {
      static getMove(board, size, aiSym, oppSym, difficulty, winStreak = size, restricted = []) {
        const legal = GameEngine.getLegalMoves(board, restricted);
        if (legal.length === 0) return -1;
        if (legal.length === 1) return legal[0];

        if (difficulty === 'easy') {
          return legal[Math.floor(Math.random() * legal.length)];
        }

        if (difficulty === 'medium') {
          const winMove = this.findWinningMove(board, legal, aiSym, size, winStreak);
          if (winMove !== -1) return winMove;
          const blockMove = this.findWinningMove(board, legal, oppSym, size, winStreak);
          if (blockMove !== -1) return blockMove;
          if (size === 3 && legal.includes(4)) return 4;
          return legal[Math.floor(Math.random() * legal.length)];
        }

        if (difficulty === 'hard') {
          const winMove = this.findWinningMove(board, legal, aiSym, size, winStreak);
          if (winMove !== -1) return winMove;
          const blockMove = this.findWinningMove(board, legal, oppSym, size, winStreak);
          if (blockMove !== -1) return blockMove;
          const center = Math.floor((size * size) / 2);
          if (legal.includes(center)) return center;
          const corners = [0, size - 1, size * (size - 1), size * size - 1].filter(c => legal.includes(c));
          if (corners.length > 0) return corners[Math.floor(Math.random() * corners.length)];
          return legal[Math.floor(Math.random() * legal.length)];
        }

        // IMPOSSIBLE MINIMAX
        const center = Math.floor((size * size) / 2);
        if (size === 3 && legal.length >= 8 && legal.includes(center)) return center;

        let bestScore = -Infinity;
        let bestMove = legal[0];
        const maxDepth = size === 3 ? 9 : 4;

        for (const move of legal) {
          board[move] = aiSym;
          const score = this.minimax(board, 0, false, -Infinity, Infinity, aiSym, oppSym, size, winStreak, maxDepth);
          board[move] = null;
          if (score > bestScore) {
            bestScore = score;
            bestMove = move;
          }
        }
        return bestMove;
      }

      static minimax(board, depth, isMax, alpha, beta, aiSym, oppSym, size, winStreak, maxDepth) {
        const { winner } = GameEngine.checkWinner(board, size, winStreak);
        if (winner === aiSym) return 100 - depth;
        if (winner === oppSym) return depth - 100;
        if (GameEngine.isFull(board) || depth >= maxDepth) return 0;

        const legal = GameEngine.getLegalMoves(board);
        if (isMax) {
          let maxEval = -Infinity;
          for (const move of legal) {
            board[move] = aiSym;
            const evalScore = this.minimax(board, depth + 1, false, alpha, beta, aiSym, oppSym, size, winStreak, maxDepth);
            board[move] = null;
            maxEval = Math.max(maxEval, evalScore);
            alpha = Math.max(alpha, evalScore);
            if (beta <= alpha) break;
          }
          return maxEval;
        } else {
          let minEval = Infinity;
          for (const move of legal) {
            board[move] = oppSym;
            const evalScore = this.minimax(board, depth + 1, true, alpha, beta, aiSym, oppSym, size, winStreak, maxDepth);
            board[move] = null;
            minEval = Math.min(minEval, evalScore);
            beta = Math.min(beta, evalScore);
            if (beta <= alpha) break;
          }
          return minEval;
        }
      }

      static findWinningMove(board, legal, sym, size, winStreak) {
        for (const m of legal) {
          board[m] = sym;
          const { winner } = GameEngine.checkWinner(board, size, winStreak);
          board[m] = null;
          if (winner === sym) return m;
        }
        return -1;
      }
    }

        return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, '0');

      }

        const cleanUser = username.trim();
        const accounts = this.getAccounts();
        const key = cleanUser.toLowerCase();
        const account = accounts[key];
        if (!account) {
          throw new Error('Invalid username or password.');
        }

        const hash = await this.hashPassword(cleanUser, password);
        if (hash !== account.passwordHash) {
          throw new Error('Invalid username or password.');
        }

        const user = { id: account.id, username: account.username, isGuest: false };
        this.setCurrentUser(user);
        return user;
      }

      static logout() {
        const guestUser = { id: 'guest', username: 'Guest', isGuest: true };
        this.setCurrentUser(guestUser);
        return guestUser;
      }

      static getUserStorageKey(userId) {
        return `zero_kaata_user_${userId}`;
      }
    }

      const questionStatusRef = useRef('idle');

      const movePermissionRef = useRef(null);

      useEffect(() => { questionStatusRef.current = questionStatus; }, [questionStatus]);

      // User Data Loading & Persistence Functions
      const loadUserData = (user) => {
        try {
          const storageKey = AuthService.getUserStorageKey(user.id);
          const raw = localStorage.getItem(storageKey);
          if (raw) {
            const data = JSON.parse(raw);
            if (data.stats) setStats(data.stats);

            if (data.matchHistory) setMatchHistory(data.matchHistory);
            else setMatchHistory([]);
            if (data.usedQuestionIds) setUsedQuestionIds(data.usedQuestionIds);
            else setUsedQuestionIds([]);
            if (data.theme) {
              setTheme(data.theme);
              document.documentElement.setAttribute('data-theme', data.theme);
            }
            if (data.view3D !== undefined) setView3D(data.view3D);

      const saveUserData = (user, updatedStats, updatedHistory, updatedUsedQuestions) => {

      };

      // Load User Data on Mount
      useEffect(() => {
        const user = AuthService.getCurrentUser();
        setCurrentUser(user);
        loadUserData(user);

        // Check if arrived via invite URL (?room=BTG-XXXX)

      const showToast = (title, message) => {

      };

      const formatTime = (secs) => {

        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const generateRoomCode = () => {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

      };

      // -------------------------------------------------------------
      // AUTHENTICATION HANDLERS
      // -------------------------------------------------------------
      const handleAuthLogin = async (e) => {
        if (e) e.preventDefault();

          SoundManager.playWin();
          showToast('Welcome Back!', `Logged in successfully as ${user.username}.`);

      };

      const handleAuthRegister = async (e) => {
        if (e) e.preventDefault();

          setAuthError('Passwords do not match.');
          SoundManager.playError();

        try {

      const handleAuthLogout = () => {

      };

      // -------------------------------------------------------------
      // MATCH SETUP & START MATCH (ISSUES 2, 3, 4, 5 RESOLUTION)
      // -------------------------------------------------------------
      const [showMatchSetupModal, setShowMatchSetupModal] = useState(false);
      const [matchSetupConfig, setMatchSetupConfig] = useState({
        mode: 'friend',
        size: 3,
        diff: 'impossible',
        protocol: 'knowledge_battle',
        p1Name: 'Player 1',

      });

      const openMatchSetup = (mode = 'friend', size = 3, diff = aiDiff) => {
        setMatchSetupConfig({
          mode,
          size: size || 3,

        });

      const launchConfiguredMatch = () => {
        setShowMatchSetupModal(false);
        setShowModeSelectModal(false);
        const chosenMode = matchSetupConfig.mode;
        if (chosenMode === 'friend') {

      const promptGameModeSelection = (mode = gameModeRef.current, size = 3, diff = aiDiff) => {

      const confirmStartMatch = (chosenBattleMode) => {

      const startMatch = (mode = gameModeRef.current, size = 3, diff = aiDiff, battleProtocol = selectedBattleMode) => {

        if (targetMode === 'online' && onlineStatus !== 'connected') {
          targetMode = 'ai';

      // -------------------------------------------------------------
      // AI/ML KNOWLEDGE BATTLE ENGINE METHODS
      // -------------------------------------------------------------
      const spawnQuestion = (customUsedIds = null) => {
        clearQuestionTimers();
        const activeUsed = customUsedIds || usedQuestionIds;
        const q = AIMLQuestionEngine.getNextQuestion(activeUsed);
        const nextUsed = [...activeUsed, q.id];
        setUsedQuestionIds(nextUsed);
        saveUserData(currentUser, null, null, nextUsed);

        const durationMs = AIMLQuestionEngine.QUESTION_DURATION_MS; // 20000ms
        const deadline = Date.now() + durationMs;

        // Synchronously update refs FIRST
        questionStatusRef.current = 'active';
        currentQuestionRef.current = q;
        questionDeadlineRef.current = deadline;
        movePermissionRef.current = null;

        setCurrentQuestion(q);
        setQuestionDeadline(deadline);
        setQuestionRemainingMs(durationMs);
        setQuestionStatus('active');
        setP1Answer(null);
        setP2Answer(null);
        setAiAnswerState(null);
        setQuestionWinner(null);
        setQuestionWinnerSym(null);
        setExplanationVisible(false);
        setMovePermission(null);

        // Online Host broadcast
        if (gameModeRef.current === 'online' && onlineRole === 'host') {
          sendOnlineMsg({
            type: 'QUESTION_START',
            question: {
              id: q.id,
              topic: q.topic,
              difficulty: q.difficulty,
              question: q.question,
              options: q.options
            },
            deadline,
            questionId: q.id
          });
        }

        // Genuine AI Answering Simulation in AI Mode ONLY
        if (gameModeRef.current === 'ai') {
          setAiAnswerState({ isThinking: true, option: null, isCorrect: null });
          const plan = AIMLQuestionEngine.simulateAIAnswer(q, aiDiff);
          aiTimerRef.current = setTimeout(() => {
            handleAIAnswerSubmission(q, plan.option);
          }, plan.delayMs);
        } else {
          setAiAnswerState(null);
        }
      };

      const handleQuestionExpired = () => {
        questionStatusRef.current = 'expired';
        setQuestionStatus('expired');
        setExplanationVisible(true);
        movePermissionRef.current = null;
        setMovePermission(null);
        SoundManager.playError();
        showToast("Time's Up!", "20 seconds elapsed. No player earned a move. Next question loading...");

        if (gameModeRef.current === 'online' && onlineRole === 'host' && currentQuestionRef.current) {
          sendOnlineMsg({
            type: 'QUESTION_EXPIRED',
            questionId: currentQuestionRef.current.id,
            answer: currentQuestionRef.current.answer,
            explanation: currentQuestionRef.current.explanation
          });
        }

        clearQuestionTimers();
        nextQuestionTimeoutRef.current = setTimeout(() => {
          setGameStatus(latestStatus => {
            if (latestStatus === 'playing') {
              spawnQuestion();
            }
            return latestStatus;
          });
        }, 2600);
      };

      const submitPlayerAnswer = (playerRole, option) => {
        if (questionStatusRef.current !== 'active' || !currentQuestionRef.current) return;
        const q = currentQuestionRef.current;

        // In Online Mode (Guest): send submission to authoritative Host
        if (gameModeRef.current === 'online' && onlineRole === 'guest') {
          sendOnlineMsg({
            type: 'SUBMIT_ANSWER',
            questionId: q.id,
            option,
            playerRole: 'guest'
          });
          setP2Answer({ option, isCorrect: null, timestamp: Date.now() });
          return;
        }

        // Track stats for questions answered
        setStats(prev => ({
          ...prev,
          questionsAnswered: (prev.questionsAnswered || 0) + 1
        }));

        // Evaluate answer
        const isCorrect = (option === q.answer);

        if (playerRole === 'p1' || (gameModeRef.current === 'online' && onlineRole === 'host')) {
          setP1Answer({ option, isCorrect, timestamp: Date.now() });
        } else if (playerRole === 'p2') {
          setP2Answer({ option, isCorrect, timestamp: Date.now() });
        }

        if (!isCorrect) {
          SoundManager.playError();
          showToast("Incorrect Answer", "Wrong option. Try again before 20s expires!");
          return;
        }

        // Correct answer tracking
        setStats(prev => ({
          ...prev,
          questionsCorrect: (prev.questionsCorrect || 0) + 1
        }));

        // FIRST ACCEPTED CORRECT ANSWER WINS
        clearQuestionTimers();
        SoundManager.playWin();

        const winnerId = playerRole === 'p1' ? 'p1' : 'p2';
        const winSym = (playerRole === 'p1' ? 'X' : 'O');

        questionStatusRef.current = 'resolved';
        setQuestionStatus('resolved');
        setQuestionWinner(winnerId);
        setQuestionWinnerSym(winSym);
        setExplanationVisible(true);

        const perm = { player: winnerId, symbol: winSym, questionId: q.id };
        movePermissionRef.current = perm;
        setMovePermission(perm);

        const winnerDisplayName = playerRole === 'p1' ? (gameModeRef.current === 'friend' ? player1Name : (currentUser.isGuest ? 'You' : currentUser.username)) : (gameModeRef.current === 'friend' ? player2Name : 'Player 2');
        showToast("Question Solved!", `+1 Move Permission granted to ${winnerDisplayName} (${winSym})! Select an open cell.`);

        if (gameModeRef.current === 'online' && onlineRole === 'host') {
          sendOnlineMsg({
            type: 'QUESTION_RESOLVED',
            questionId: q.id,
            winner: 'host',
            winnerSymbol: 'X',
            answer: q.answer,
            explanation: q.explanation
          });
        }
      };

      const handleAIAnswerSubmission = (targetQuestion, option) => {
        // Strict guard: ONLY in AI mode!
        if (gameModeRef.current !== 'ai') return;
        if (questionStatusRef.current !== 'active' || !currentQuestionRef.current || currentQuestionRef.current.id !== targetQuestion.id) {
          return;
        }

        const isCorrect = (option === targetQuestion.answer);
        setAiAnswerState({ isThinking: false, option, isCorrect, timestamp: Date.now() });

        if (!isCorrect) {
          const remaining = Math.max(0, questionDeadlineRef.current - Date.now());
          if (remaining > 4500) {
            aiTimerRef.current = setTimeout(() => {
              if (gameModeRef.current === 'ai' && questionStatusRef.current === 'active' && currentQuestionRef.current && currentQuestionRef.current.id === targetQuestion.id) {
                const retryPlan = AIMLQuestionEngine.simulateAIAnswer(targetQuestion, aiDiff);
                handleAIAnswerSubmission(targetQuestion, retryPlan.option);
              }
            }, 3500);
          }
          return;
        }

        // AI answered correctly FIRST
        clearQuestionTimers();
        SoundManager.playError();

        questionStatusRef.current = 'resolved';
        setQuestionStatus('resolved');
        setQuestionWinner('ai');
        setQuestionWinnerSym(oppSym);
        setExplanationVisible(true);

        const perm = { player: 'ai', symbol: oppSym, questionId: targetQuestion.id };
        movePermissionRef.current = perm;
        setMovePermission(perm);
        showToast("Aether AI Won the Move!", `AI answered Option ${option} correctly and earned the next placement.`);

        setTimeout(() => {
          executeAIMove(perm);
        }, 750);
      };

      const executeAIMove = (perm) => {
        if (gameModeRef.current !== 'ai') return;
        setBoard(latestBoard => {
          const { winner: checkWin } = GameEngine.checkWinner(latestBoard, boardSize, boardSize);
          if (checkWin || GameEngine.isFull(latestBoard)) {
            movePermissionRef.current = null;
            setMovePermission(null);
            return latestBoard;
          }

          const aiMove = MinimaxAI.getMove(latestBoard, boardSize, oppSym, playerSym, aiDiff, boardSize);
          if (aiMove !== -1 && latestBoard[aiMove] === null) {
            SoundManager.playMove(oppSym === 'X');
            const updated = [...latestBoard];
            updated[aiMove] = oppSym;
            setMoveHistory(prev => [...prev, { index: aiMove, sym: oppSym }]);
            movePermissionRef.current = null;
            setMovePermission(null);

            const { winner: aiWin, winningLine: aiLine } = GameEngine.checkWinner(updated, boardSize, boardSize);
            if (aiWin) {
              finishGameOver(aiWin, aiLine, 'ai');
            } else if (GameEngine.isFull(updated)) {
              finishGameOver('draw', null, 'ai');
            } else {
              setTurn(playerSym);
              setTimeout(() => {
                setGameStatus(curStatus => {
                  if (curStatus === 'playing') spawnQuestion();
                  return curStatus;
                });
              }, 800);
            }
            return updated;
          }

          movePermissionRef.current = null;
          setMovePermission(null);
          return latestBoard;
        });
      };

      // Mode A: Normal AI Move execution (Turn-based, no questions)
      const executeNormalAIMove = () => {
        if (gameModeRef.current !== 'ai') return;
        setIsAiThinking(true);
        setTimeout(() => {
          setBoard(latestBoard => {
            const { winner: checkWin } = GameEngine.checkWinner(latestBoard, boardSize, boardSize);
            if (checkWin || GameEngine.isFull(latestBoard)) {
              setIsAiThinking(false);
              return latestBoard;
            }

            const aiMove = MinimaxAI.getMove(latestBoard, boardSize, oppSym, playerSym, aiDiff, boardSize);
            setIsAiThinking(false);
            if (aiMove !== -1 && latestBoard[aiMove] === null) {
              SoundManager.playMove(oppSym === 'X');
              const updated = [...latestBoard];
              updated[aiMove] = oppSym;
              setMoveHistory(prev => [...prev, { index: aiMove, sym: oppSym }]);

              const { winner: aiWin, winningLine: aiLine } = GameEngine.checkWinner(updated, boardSize, boardSize);
              if (aiWin) {
                finishGameOver(aiWin, aiLine, 'ai');
              } else if (GameEngine.isFull(updated)) {
                finishGameOver('draw', null, 'ai');
              } else {
                setTurn(playerSym);
              }
              return updated;
            }
            return latestBoard;
          });
        }, 500);
      };

      // -------------------------------------------------------------
      // ONLINE MULTIPLAYER
      // -------------------------------------------------------------
      const cleanupOnline = () => {
        clearQuestionTimers();
        if (connRef.current) {
          try { connRef.current.close(); } catch {}
          connRef.current = null;
        }
        if (peerRef.current) {
          try { peerRef.current.destroy(); } catch {}
          peerRef.current = null;
        }
        if (broadcastRef.current) {
          try { broadcastRef.current.close(); } catch {}
          broadcastRef.current = null;
        }
      };

      const sendOnlineMsg = (data) => {
        if (broadcastRef.current) {
          try { broadcastRef.current.postMessage(data); } catch {}
        }
        if (connRef.current && connRef.current.open) {
          try { connRef.current.send(data); } catch {}
        }
      };

      const handleIncomingOnlineMsg = (data) => {
        if (!data || !data.type) return;

        if (data.type === 'GUEST_JOINED') {
          setOnlineStatus('connected');
          SoundManager.playClick();
          showToast('Player Joined!', `${data.guestName || 'Opponent'} connected to room! Game starting!`);
          sendOnlineMsg({ type: 'HOST_ACK', hostName: player1Name, battleMode: activeBattleModeRef.current });
          setBoard(Array(9).fill(null));
          setTurn('X');
          setGameStatus('playing');
          setWinner(null);
          setWinningLine(null);
          setPlayerSym('X');
          setOppSym('O');
          setMatchElapsedSeconds(0);
          setView('play');
          if (activeBattleModeRef.current === 'knowledge_battle') {
            setTimeout(() => spawnQuestion([]), 450);
          } else {
            clearQuestionTimers();
            setCurrentQuestion(null);
            currentQuestionRef.current = null;
            setQuestionStatus('idle');
            questionStatusRef.current = 'idle';
          }
        }

        if (data.type === 'HOST_ACK') {
          setOnlineStatus('connected');
          SoundManager.playClick();
          showToast('Room Connected!', `Joined match hosted by ${data.hostName || 'Host'}!`);
          if (data.battleMode) {
            setActiveBattleMode(data.battleMode);
            activeBattleModeRef.current = data.battleMode;
          }
          setBoard(Array(9).fill(null));
          setTurn('X');
          setGameStatus('playing');
          setWinner(null);
          setWinningLine(null);
          setPlayerSym('O');
          setOppSym('X');
          setMatchElapsedSeconds(0);
          setView('play');
          if (data.battleMode === 'normal') {
            clearQuestionTimers();
            setCurrentQuestion(null);
            currentQuestionRef.current = null;
            setQuestionStatus('idle');
            questionStatusRef.current = 'idle';
          }
        }

        if (data.type === 'QUESTION_START') {
          clearQuestionTimers();
          setCurrentQuestion(data.question);
          setQuestionDeadline(data.deadline);
          setQuestionRemainingMs(Math.max(0, data.deadline - Date.now()));
          setQuestionStatus('active');
          setP1Answer(null);
          setP2Answer(null);
          setQuestionWinner(null);
          setQuestionWinnerSym(null);
          setExplanationVisible(false);
          setMovePermission(null);
        }

        if (data.type === 'SUBMIT_ANSWER') {
          if (onlineRole === 'host' && questionStatus === 'active' && currentQuestion && currentQuestion.id === data.questionId) {
            const isCorrect = (data.option === currentQuestion.answer);
            if (isCorrect) {
              clearQuestionTimers();
              SoundManager.playWin();
              setQuestionStatus('resolved');
              setQuestionWinner('guest');
              setQuestionWinnerSym('O');
              setExplanationVisible(true);
              const perm = { player: 'guest', symbol: 'O', questionId: currentQuestion.id };
              setMovePermission(perm);
              showToast("Opponent Won Question", "Guest answered correctly first! Move granted to opponent.");
              sendOnlineMsg({
                type: 'QUESTION_RESOLVED',
                questionId: currentQuestion.id,
                winner: 'guest',
                winnerSymbol: 'O',
                answer: currentQuestion.answer,
                explanation: currentQuestion.explanation
              });
            } else {
              sendOnlineMsg({
                type: 'ANSWER_FEEDBACK',
                questionId: currentQuestion.id,
                option: data.option,
                isCorrect: false
              });
            }
          }
        }

        if (data.type === 'ANSWER_FEEDBACK') {
          SoundManager.playError();
          setP2Answer({ option: data.option, isCorrect: false, timestamp: Date.now() });
          showToast("Incorrect Answer", "Wrong option. Try again before time expires!");
        }

        if (data.type === 'QUESTION_RESOLVED') {
          clearQuestionTimers();
          setQuestionStatus('resolved');
          setQuestionWinner(data.winner);
          setQuestionWinnerSym(data.winnerSymbol);
          setExplanationVisible(true);
          const myRole = onlineRole === 'host' ? 'host' : 'guest';
          const perm = { player: data.winner, symbol: data.winnerSymbol, questionId: data.questionId };
          setMovePermission(perm);
          if (data.winner === myRole) {
            SoundManager.playWin();
            showToast("Question Won!", "You answered correctly first! Exactly 1 move earned — select an open cell.");
          } else {
            SoundManager.playError();
            showToast("Opponent Won Move", "Opponent answered correctly first and earned the next move.");
          }
        }

        if (data.type === 'QUESTION_EXPIRED') {
          setQuestionStatus('expired');
          setExplanationVisible(true);
          setMovePermission(null);
          SoundManager.playError();
          showToast("Time's Up!", `Question expired! Correct answer was Option ${data.answer}.`);
        }

        if (data.type === 'MOVE') {
          handleRemoteMove(data.index, data.symbol);
        }

        if (data.type === 'REACTION') {
          triggerReactionDisplay(data.emoji);
        }

        if (data.type === 'REMATCH_REQ') {
          setRematchStatus('requested_by_them');
          SoundManager.playClick();
          showToast('Rematch Requested', 'Opponent wants a rematch! Click "Accept Rematch" to play.');
        }

        if (data.type === 'REMATCH_ACCEPT') {
          clearQuestionTimers();
          setBoard(Array(boardSize * boardSize).fill(null));
          setTurn('X');
          setGameStatus('playing');
          setWinner(null);
          setWinningLine(null);
          setRematchStatus(null);
          setMatchElapsedSeconds(0);
          setMovePermission(null);
          SoundManager.playWin();
          showToast('Rematch Started', 'The grid has been reset! Answer first to move.');
          if (onlineRole === 'host' && activeBattleModeRef.current === 'knowledge_battle') {
            setTimeout(() => spawnQuestion([]), 450);
          }
        }

        if (data.type === 'LEAVE') {
          setOnlineStatus('disconnected');
          SoundManager.playError();
          showToast('Opponent Disconnected', 'Opponent has left the online room.');
        }
      };

      const hostOnlineRoom = () => {
        cleanupOnline();
        const code = generateRoomCode();
        setRoomCode(code);
        setOnlineRole('host');
        setOnlineStatus('waiting');
        setGameMode('online');
        setPlayerSym('X');
        setOppSym('O');

        const bc = new BroadcastChannel('btg_online_channel_' + code);
        bc.onmessage = (e) => handleIncomingOnlineMsg(e.data);
        broadcastRef.current = bc;

        if (window.Peer) {
          try {
            const peerId = 'btg-room-' + code.toLowerCase().replace(/[^a-z0-9]/g, '');
            const p = new window.Peer(peerId);
            peerRef.current = p;

            p.on('open', () => {
              setOnlineLatency(18 + Math.floor(Math.random() * 12));
            });

            p.on('connection', (conn) => {
              connRef.current = conn;
              conn.on('data', (d) => handleIncomingOnlineMsg(d));
              conn.on('open', () => {
                handleIncomingOnlineMsg({ type: 'GUEST_JOINED', guestName: 'Online Player' });
              });
              conn.on('close', () => {
                handleIncomingOnlineMsg({ type: 'LEAVE' });
              });
            });

            p.on('error', (err) => {
              console.warn('PeerJS notice:', err);
            });
          } catch (e) {
            console.warn('Peer setup error:', e);
          }
        }

        SoundManager.playClick();
        showToast('Online Room Created', `Room ${code} is active. Share your code or invite link!`);
      };

      const joinOnlineRoom = (targetCode) => {
        const code = (targetCode || joinCodeInput).trim().toUpperCase();
        if (!code || code.length < 4) {
          SoundManager.playError();
          showToast('Invalid Code', 'Please enter a valid 6-character room code (e.g. BTG-7K4X).');
          return;
        }

        cleanupOnline();
        setRoomCode(code);
        setOnlineRole('guest');
        setOnlineStatus('waiting');
        setGameMode('online');
        setPlayerSym('O');
        setOppSym('X');

        const bc = new BroadcastChannel('btg_online_channel_' + code);
        bc.onmessage = (e) => handleIncomingOnlineMsg(e.data);
        broadcastRef.current = bc;

        setTimeout(() => {
          bc.postMessage({ type: 'GUEST_JOINED', guestName: player2Name || 'Player 2' });
        }, 150);

        if (window.Peer) {
          try {
            const p = new window.Peer();
            peerRef.current = p;

            p.on('open', () => {
              const hostPeerId = 'btg-room-' + code.toLowerCase().replace(/[^a-z0-9]/g, '');
              const conn = p.connect(hostPeerId, { reliable: true });
              connRef.current = conn;

              conn.on('open', () => {
                conn.send({ type: 'GUEST_JOINED', guestName: player2Name || 'Player 2' });
              });
              conn.on('data', (d) => handleIncomingOnlineMsg(d));
              conn.on('close', () => handleIncomingOnlineMsg({ type: 'LEAVE' }));
            });

            p.on('error', (err) => {
              console.warn('Peer connection info:', err);
            });
          } catch (e) {
            console.warn('Peer join error:', e);
          }
        }

        SoundManager.playClick();
        showToast('Connecting to Room', `Attempting connection to Room ${code}...`);
      };

      const copyInviteLink = () => {
        const url = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
        navigator.clipboard.writeText(url).then(() => {
          SoundManager.playClick();
          showToast('Invite Link Copied! 📋', 'Share this direct link with your friend to play together!');
        }).catch(() => {
          prompt('Copy this invite URL:', url);
        });
      };

      const copyRoomCode = () => {
        navigator.clipboard.writeText(roomCode).then(() => {
          SoundManager.playClick();
          showToast('Room Code Copied! 📋', `Code: ${roomCode}`);
        }).catch(() => {
          prompt('Copy Room Code:', roomCode);
        });
      };

      const sendReaction = (emoji) => {
        triggerReactionDisplay(emoji);
        sendOnlineMsg({ type: 'REACTION', emoji, sender: playerSym });
        SoundManager.playReaction();
      };

      const triggerReactionDisplay = (emoji) => {
        const id = Date.now();
        setActiveReaction({ emoji, id });
        SoundManager.playReaction();
        setTimeout(() => {
          setActiveReaction(prev => prev && prev.id === id ? null : prev);
        }, 1600);
      };

      const requestOnlineRematch = () => {
        if (rematchStatus === 'requested_by_them') {
          sendOnlineMsg({ type: 'REMATCH_ACCEPT' });
          clearQuestionTimers();
          setBoard(Array(boardSize * boardSize).fill(null));
          setTurn('X');
          setGameStatus('playing');
          setWinner(null);
          setWinningLine(null);
          setRematchStatus(null);
          setMatchElapsedSeconds(0);
          setMovePermission(null);
          SoundManager.playWin();
          showToast('Rematch Accepted!', 'The battlefield is reset! Ready for round 2.');
          if (onlineRole === 'host' && activeBattleModeRef.current === 'knowledge_battle') {
            setTimeout(() => spawnQuestion([]), 450);
          }
        } else {
          setRematchStatus('requested_by_me');
          sendOnlineMsg({ type: 'REMATCH_REQ' });
          SoundManager.playClick();
          showToast('Rematch Requested', 'Waiting for opponent to accept...');
        }
      };

      // -------------------------------------------------------------
      // MOVE HANDLER (INTEGRATED WITH QUESTION BATTLE & NORMAL MODE)
      // -------------------------------------------------------------
      const handleRemoteMove = (index, symbol) => {
        setBoard(prevBoard => {
          if (prevBoard[index] !== null) return prevBoard;
          SoundManager.playMove(symbol === 'X');

          const newBoard = [...prevBoard];
          newBoard[index] = symbol;
          setMoveHistory(h => [...h, { index, sym: symbol }]);
          movePermissionRef.current = null;
          setMovePermission(null);

          const { winner: winSym, winningLine: line } = GameEngine.checkWinner(newBoard, boardSize, boardSize);
          if (winSym) {
            finishGameOver(winSym, line, 'online');
          } else if (GameEngine.isFull(newBoard)) {
            finishGameOver('draw', null, 'online');
          } else {
            setTurn(symbol === 'X' ? 'O' : 'X');
            // In Knowledge Battle mode: Host triggers next question automatically
            if (activeBattleModeRef.current === 'knowledge_battle') {
              if (onlineRole === 'host') {
                setTimeout(() => {
                  setGameStatus(s => { if (s === 'playing') spawnQuestion(); return s; });
                }, 800);
              }
            }
          }

          return newBoard;
        });
      };

      const handleCellClick = (index) => {
        if (gameStatus !== 'playing') return;

        // MODE B: AI/ML KNOWLEDGE BATTLE MOVE VALIDATION
        if (activeBattleModeRef.current === 'knowledge_battle') {
          if (!movePermission) {
            SoundManager.playError();
            showToast("Move Locked", "Answer the AI/ML Question correctly first to earn a move!");
            return;
          }

          // Verify permission ownership
          if (gameModeRef.current === 'ai') {
            if (movePermission.player !== 'p1') {
              SoundManager.playError();
              showToast("AI Move In Progress", "Aether AI won the question and is executing its move.");
              return;
            }
          } else if (gameModeRef.current === 'online') {
            const myRole = onlineRole === 'host' ? 'host' : 'guest';
            if (movePermission.player !== myRole) {
              SoundManager.playError();
              showToast("Opponent's Move", "Opponent won the question battle and has the move.");
              return;
            }
          }
        } else {
          // MODE A: NORMAL TIC-TAC-TOE TURN VALIDATION
          if (gameModeRef.current === 'ai') {
            if (turn !== playerSym || isAiThinking) {
              SoundManager.playError();
              showToast("AI Calculating", "Wait for Aether AI to complete its turn.");
              return;
            }
          } else if (gameModeRef.current === 'online') {
            const myTurnSym = onlineRole === 'host' ? 'X' : 'O';
            if (turn !== myTurnSym) {
              SoundManager.playError();
              showToast("Opponent's Turn", "Waiting for opponent to place their symbol.");
              return;
            }
          }
        }

        // Active Power-Ups
        if (activePowerUp === 'eraser') {
          if (board[index] === null) {
            showToast('Invalid Target', 'Cell is empty. Choose a cell with a symbol.');
            SoundManager.playError();
            return;
          }
          if (shields.includes(index)) {
            showToast('Shielded Cell', 'Aegis Shield blocks the Quantum Eraser!');
            SoundManager.playError();
            return;
          }
          const next = [...board];
          next[index] = null;
          setBoard(next);
          setInventory(inv => ({ ...inv, eraser: Math.max(0, inv.eraser - 1) }));
          setActivePowerUp(null);
          movePermissionRef.current = null;
          setMovePermission(null);
          SoundManager.playPowerUp();
          showToast('Quantum Eraser', 'Cell symbol has been vaporized!');
          if (activeBattleMode === 'knowledge_battle') {
            if (gameMode !== 'online' || onlineRole === 'host') {
              setTimeout(() => {
                setGameStatus(s => { if (s === 'playing') spawnQuestion(); return s; });
              }, 800);
            }
          }
          return;
        }

        if (activePowerUp === 'shield') {
          const expectedSym = activeBattleMode === 'knowledge_battle' ? movePermission?.symbol : turn;
          if (board[index] !== expectedSym) {
            showToast('Invalid Target', 'You can only shield your own placed symbols.');
            SoundManager.playError();
            return;
          }
          setShields(prev => [...prev, index]);
          setInventory(inv => ({ ...inv, shield: Math.max(0, inv.shield - 1) }));
          setActivePowerUp(null);
          movePermissionRef.current = null;
          setMovePermission(null);
          SoundManager.playPowerUp();
          showToast('Aegis Shield', 'Symbol encased in energy barrier!');
          if (activeBattleMode === 'knowledge_battle') {
            if (gameMode !== 'online' || onlineRole === 'host') {
              setTimeout(() => {
                setGameStatus(s => { if (s === 'playing') spawnQuestion(); return s; });
              }, 800);
            }
          }
          return;
        }

        // Cell must be unoccupied
        if (board[index] !== null) {
          SoundManager.playError();
          return;
        }

        // Clear any hint
        setHintSquare(null);
        setHintText('');

        const movingSymbol = activeBattleMode === 'knowledge_battle' ? movePermission.symbol : turn;
        SoundManager.playMove(movingSymbol === 'X');

        const newBoard = [...board];
        newBoard[index] = movingSymbol;
        setBoard(newBoard);
        setMoveHistory(prev => [...prev, { index, sym: movingSymbol }]);

        // MOVE PERMISSION CONSUMED
        movePermissionRef.current = null;
        setMovePermission(null);

        if (gameModeRef.current === 'online') {
          sendOnlineMsg({ type: 'MOVE', index, symbol: movingSymbol, questionId: currentQuestion?.id });
        }

        const { winner: winSym, winningLine: line } = GameEngine.checkWinner(newBoard, boardSize, boardSize);
        if (winSym) {
          finishGameOver(winSym, line, gameModeRef.current);
          return;
        }
        if (GameEngine.isFull(newBoard)) {
          finishGameOver('draw', null, gameModeRef.current);
          return;
        }

        const nextTurn = movingSymbol === 'X' ? 'O' : 'X';
        setTurn(nextTurn);

        // NEXT STEP ROUTING BASED ON BATTLE PROTOCOL
        if (activeBattleModeRef.current === 'knowledge_battle') {
          if (gameModeRef.current !== 'online' || onlineRole === 'host') {
            setTimeout(() => {
              setGameStatus(s => {
                if (s === 'playing') {
                  spawnQuestion();
                }
                return s;
              });
            }, 800);
          }
        } else if (activeBattleModeRef.current === 'normal') {
          if (gameModeRef.current === 'ai' && nextTurn === oppSym) {
            setTimeout(() => {
              executeNormalAIMove();
            }, 500);
          }
        }
      };

      // -------------------------------------------------------------
      // GAME OVER
      // -------------------------------------------------------------
      const finishGameOver = (result, line, mode) => {
        setGameStatus(result === 'draw' ? 'draw' : 'won');
        setWinner(result);
        setWinningLine(line);

        let isWin = false;
        let xpGain = 30;

        if (mode === 'friend') {
          if (result === 'X') {
            setFriendScore(s => ({ ...s, p1: s.p1 + 1 }));
            SoundManager.playWin();
            if (window.confetti) window.confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
            isWin = true;
            xpGain = 80;
          } else if (result === 'O') {
            setFriendScore(s => ({ ...s, p2: s.p2 + 1 }));
            SoundManager.playWin();
            if (window.confetti) window.confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
            isWin = false;
            xpGain = 40;
          } else {
            setFriendScore(s => ({ ...s, draws: s.draws + 1 }));
            SoundManager.playDraw();
            isWin = false;
            xpGain = 50;
          }
        } else if (mode === 'ai') {
          isWin = result === playerSym;
          xpGain = isWin ? 150 : result === 'draw' ? 70 : 30;
          if (isWin) {
            SoundManager.playWin();
            if (window.confetti) window.confetti({ particleCount: 130, spread: 80, origin: { y: 0.6 } });
          } else if (result === 'draw') {
            SoundManager.playDraw();
          } else {
            SoundManager.playError();
          }
        } else if (mode === 'online') {
          isWin = result === playerSym;
          xpGain = isWin ? 180 : result === 'draw' ? 90 : 40;
          if (isWin) {
            SoundManager.playWin();
            if (window.confetti) window.confetti({ particleCount: 140, spread: 85, origin: { y: 0.6 } });
          } else if (result === 'draw') {
            SoundManager.playDraw();
          } else {
            SoundManager.playError();
          }
        }

        const battleTag = activeBattleMode === 'knowledge_battle' ? ' [Knowledge Battle]' : ' [Normal]';
        const newRecord = {
          id: Date.now(),
          mode: (mode === 'friend' ? 'Play with Friend' : mode === 'ai' ? `Vs AI (${aiDiff})` : `Online Room (${roomCode || 'P2P'})`) + battleTag,
          opponent: mode === 'friend' ? `${player1Name} vs ${player2Name}` : mode === 'ai' ? `Aether AI` : `Online Player`,
          result: result === 'draw' ? 'Draw' : (mode === 'friend' ? (result === 'X' ? `${player1Name} Won` : `${player2Name} Won`) : (result === playerSym ? 'Victory' : 'Defeat')),
          date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          moves: board.filter(c => c !== null).length + 1
        };

        const updatedHistory = [newRecord, ...matchHistory].slice(0, 50);
        setMatchHistory(updatedHistory);

        setStats(prev => {
          const newMatches = prev.matches + 1;
          const newWins = isWin && result !== 'draw' ? prev.wins + 1 : prev.wins;
          const newLosses = (!isWin && result !== 'draw') ? prev.losses + 1 : prev.losses;
          const newDraws = result === 'draw' ? prev.draws + 1 : prev.draws;
          const newStreak = isWin && result !== 'draw' ? prev.streak + 1 : 0;
          const newBestStreak = Math.max(prev.bestStreak, newStreak);
          const newXP = prev.xp + xpGain;
          const newLevel = 1 + Math.floor(Math.pow(newXP / 150, 0.65));

          const updated = {
            ...prev,
            matches: newMatches, wins: newWins, losses: newLosses, draws: newDraws,
            streak: newStreak, bestStreak: newBestStreak, xp: newXP, level: newLevel
          };

          saveUserData(currentUser, updated, updatedHistory);
          return updated;
        });
      };

      const triggerUndo = () => {
        if (inventory.undo <= 0 || gameMode === 'online' || gameStatus !== 'playing' || isAiThinking) return;
        if (moveHistory.length === 0) {
          showToast('Undo', 'No moves to undo yet.');
          return;
        }

        SoundManager.playPowerUp();
        setInventory(inv => ({ ...inv, undo: inv.undo - 1 }));

        if (gameMode === 'friend') {
          const last = moveHistory[moveHistory.length - 1];
          const newHistory = moveHistory.slice(0, -1);
          setMoveHistory(newHistory);
          setBoard(prev => {
            const next = [...prev];
            next[last.index] = null;
            return next;
          });
          setTurn(last.sym);
          showToast('Chrono Rewind', 'Last move reversed!');
          if (activeBattleMode === 'knowledge_battle') {
            setTimeout(() => spawnQuestion(), 400);
          }
        } else if (gameMode === 'ai') {
          // Revert both AI move and player's move so it returns to player's turn
          const countToRevert = moveHistory.length >= 2 ? 2 : 1;
          const reverted = moveHistory.slice(-countToRevert);
          const newHistory = moveHistory.slice(0, -countToRevert);
          setMoveHistory(newHistory);
          setBoard(prev => {
            const next = [...prev];
            reverted.forEach(m => { next[m.index] = null; });
            return next;
          });
          setTurn(playerSym);
          setIsAiThinking(false);
          showToast('Chrono Rewind', activeBattleMode === 'knowledge_battle' ? 'Moves reversed — answer question to make your move!' : 'Moves reversed — your turn on the grid!');
          if (activeBattleMode === 'knowledge_battle') {
            setTimeout(() => spawnQuestion(), 400);
          }

      const triggerHint = () => {
        if (inventory.hint <= 0 || gameMode === 'online') return;
        SoundManager.playPowerUp();
        const best = MinimaxAI.getMove(board, boardSize, playerSym, oppSym, 'impossible', boardSize);
        if (best !== -1) {
          setHintSquare(best);
          setHintText(`Oracle recommends Cell ${best + 1} for optimal control.`);
          setInventory(inv => ({ ...inv, hint: inv.hint - 1 }));
          showToast('Oracle Hint', `Cell ${best + 1} highlighted!`);
        }
      };

      // Tactical Puzzle Interactions
      const handlePuzzleCell = (index) => {
        if (puzzleStatus !== 'playing') return;
        if (puzzleBoard[index] !== null) return;

        const next = [...puzzleBoard];
        next[index] = activePuzzle.playerSym;

      const runFullAudit = () => {
        setIsAuditing(true);

        setTimeout(() => {
          const results = [];
          const runTest = (name, category, fn) => {
            const start = performance.now();
            try {
              fn();
              return { name, category, passed: true, ms: Math.round((performance.now() - start) * 100) / 100, msg: 'Verified successfully' };
            } catch (err) {
              return { name, category, passed: false, ms: Math.round((performance.now() - start) * 100) / 100, msg: err.message };
            }
          };

          results.push(runTest('Horizontal Win 3x3', 'Core Rules', () => {
            const b = ['X', 'X', 'X', 'O', 'O', null, null, null, null];
            const { winner } = GameEngine.checkWinner(b, 3, 3);
            if (winner !== 'X') throw new Error('Expected winner X');
          }));

          results.push(runTest('Vertical Win 3x3', 'Core Rules', () => {
            const b = ['X', 'O', null, 'X', 'O', null, 'X', null, null];
            const { winner } = GameEngine.checkWinner(b, 3, 3);
            if (winner !== 'X') throw new Error('Expected winner X');
          }));

          results.push(runTest('Diagonal Win 3x3', 'Core Rules', () => {
            const b = ['X', 'O', null, 'O', 'X', null, null, null, 'X'];
            const { winner } = GameEngine.checkWinner(b, 3, 3);
            if (winner !== 'X') throw new Error('Expected winner X');
          }));

          results.push(runTest('Full Board Draw Detection', 'Core Rules', () => {
            const b = ['X', 'O', 'X', 'X', 'O', 'O', 'O', 'X', 'X'];
            const { winner } = GameEngine.checkWinner(b, 3, 3);
            if (winner !== null || !GameEngine.isFull(b)) throw new Error('Expected stalemate draw');
          }));

          results.push(runTest('Impossible AI Zero-Loss Verification', 'AI Engine', () => {
            let losses = 0;
            for (let i = 0; i < 20; i++) {
              const b = Array(9).fill(null);
              let t = i % 2 === 0 ? 'ai' : 'opp';
              while (true) {
                const { winner } = GameEngine.checkWinner(b, 3, 3);
                if (winner === 'X') { losses++; break; }
                if (winner === 'O' || GameEngine.isFull(b)) break;
                if (t === 'ai') {
                  const m = MinimaxAI.getMove(b, 3, 'O', 'X', 'impossible', 3);
                  b[m] = 'O';
                  t = 'opp';
                } else {
                  const legal = GameEngine.getLegalMoves(b);
                  let m = MinimaxAI.findWinningMove(b, legal, 'X', 3, 3);
                  if (m === -1) m = MinimaxAI.findWinningMove(b, legal, 'O', 3, 3);
                  if (m === -1) m = legal[Math.floor(Math.random() * legal.length)];
                  b[m] = 'X';
                  t = 'ai';
                }
              }
            }
            if (losses > 0) throw new Error(`Suffered ${losses} losses! Expected 0.`);
          }));

          results.push(runTest('Online Room Code Protocol', 'Multiplayer Engine', () => {
            const code = generateRoomCode();
            if (!code.startsWith('BTG-') || code.length !== 8) throw new Error('Invalid code format: ' + code);
          }));

          results.push(runTest('Web Audio API Synthesizer', 'Audio System', () => {
            SoundManager.init();
            if (!SoundManager.ctx) throw new Error('AudioContext not supported');
          }));

          results.push(runTest('AI/ML Question Format & Integrity', 'Knowledge Battle', () => {
            const list = AIMLQuestionEngine.CURATED_QUESTIONS;
            if (list.length < 20) throw new Error('Expected at least 20 curated questions');
            for (const q of list) {
              if (!AIMLQuestionEngine.validateQuestion(q)) throw new Error('Question failed validation: ' + q.id);
            }
          }));

          results.push(runTest('AI/ML Non-Repeating Generation', 'Knowledge Battle', () => {
            const used = [];
            for (let i = 0; i < 12; i++) {
              const q = AIMLQuestionEngine.getNextQuestion(used);
              if (used.includes(q.id)) throw new Error('Duplicate question selected: ' + q.id);
              used.push(q.id);
            }
          }));

          results.push(runTest('AI Knowledge Answering Difficulty Scaling', 'Knowledge Battle', () => {
            const sample = AIMLQuestionEngine.CURATED_QUESTIONS[0];
            const easy = AIMLQuestionEngine.simulateAIAnswer(sample, 'easy');
            const imp = AIMLQuestionEngine.simulateAIAnswer(sample, 'impossible');
            if (easy.delayMs < 4000) throw new Error('Easy AI responded too quickly: ' + easy.delayMs);
            if (imp.delayMs > 4000) throw new Error('Impossible AI responded too slowly: ' + imp.delayMs);
          }));

          results.push(runTest('20-Second Question Deadline Duration', 'Knowledge Battle', () => {
            if (AIMLQuestionEngine.QUESTION_DURATION_SECONDS !== 20) throw new Error('Expected 20s');
            if (AIMLQuestionEngine.QUESTION_DURATION_MS !== 20000) throw new Error('Expected 20000ms');
          }));

          results.push(runTest('4-Tier Difficulty Distribution Integrity', 'Knowledge Battle', () => {
            const tiers = new Set(AIMLQuestionEngine.CURATED_QUESTIONS.map(q => q.difficulty));
            ['Easy', 'Medium', 'Difficult', 'Advanced'].forEach(t => {

        } else if (winningLine.direction === 'diagonal_main') {
