<body>
  <div id="root"></div>

  <!-- Main Game Engine Scripts & React UI Bundle -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- EMBEDDED SOUND MANAGER (Pure Web Audio API Synthesizer) ---
    class SoundManager {
      static ctx = null;
      static isMuted = false;
      static masterVolume = 0.8;
      static sfxVolume = 0.9;

      static init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        } catch (e) {}
      }

      static getVol() {
        return this.isMuted ? 0 : this.masterVolume * this.sfxVolume;
      }

      static playClick() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(this.getVol() * 0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) {}
      }

      static playMove(isX) {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isX ? 'triangle' : 'sine';
          const baseFreq = isX ? 587.33 : 440;
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.08);
          gain.gain.setValueAtTime(this.getVol() * 0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } catch (e) {}
      }

      static playWin() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          const now = this.ctx.currentTime;
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0, now + idx * 0.1);
            gain.gain.linearRampToValueAtTime(this.getVol() * 0.4, now + idx * 0.1 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.45);
          });
        } catch (e) {}
      }

      static playDraw() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          [440, 415.3, 392].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(this.getVol() * 0.25, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.35);
          });
        } catch (e) {}
      }

      static playPowerUp() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
          gain.gain.setValueAtTime(this.getVol() * 0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        } catch (e) {}
      }

      static playReaction() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.12);
          gain.gain.setValueAtTime(this.getVol() * 0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } catch (e) {}
      }

      static playError() {
        try {
          this.init();
          if (!this.ctx || this.getVol() <= 0) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.setValueAtTime(110, now + 0.07);
          gain.gain.setValueAtTime(this.getVol() * 0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } catch (e) {}
      }
    }

    // --- GAME ENGINE RULES ---
    class GameEngine {
      static getWinningLines(size = 3, winStreak = size) {
        const lines = [];
        // Horizontal
        for (let r = 0; r < size; r++) {
          for (let c = 0; c <= size - winStreak; c++) {
            const line = [];
            for (let k = 0; k < winStreak; k++) line.push(r * size + (c + k));
            lines.push(line);
          }
        }
        // Vertical
        for (let c = 0; c < size; c++) {
          for (let r = 0; r <= size - winStreak; r++) {
            const line = [];
            for (let k = 0; k < winStreak; k++) line.push((r + k) * size + c);
            lines.push(line);
          }
        }
        // Diagonals
        for (let r = 0; r <= size - winStreak; r++) {
          for (let c = 0; c <= size - winStreak; c++) {
            const line = [];
            for (let k = 0; k < winStreak; k++) line.push((r + k) * size + (c + k));
            lines.push(line);
          }
        }
        // Anti-diagonals
        for (let r = 0; r <= size - winStreak; r++) {
          for (let c = winStreak - 1; c < size; c++) {
            const line = [];
            for (let k = 0; k < winStreak; k++) line.push((r + k) * size + (c - k));
            lines.push(line);
          }
        }
        return lines;
      }

      static checkWinner(board, size = 3, winStreak = size) {
        const lines = this.getWinningLines(size, winStreak);
        for (const line of lines) {
          const first = board[line[0]];
          if (!first) continue;
          let match = true;
          for (let i = 1; i < line.length; i++) {
            if (board[line[i]] !== first) { match = false; break; }
          }
          if (match) {
            let direction = 'horizontal';

        if (legal.length === 0) return -1;

        if (difficulty === 'easy') {

        }

        if (difficulty === 'medium') {

          if (winMove !== -1) return winMove;

          if (blockMove !== -1) return blockMove;
          const center = Math.floor((size * size) / 2);
          if (legal.includes(center)) return center;
          const corners = [0, size - 1, size * (size - 1), size * size - 1].filter(c => legal.includes(c));
          if (corners.length > 0) return corners[Math.floor(Math.random() * corners.length)];
          return legal[Math.floor(Math.random() * legal.length)];
        }

        // IMPOSSIBLE MINIMAX
        const center = Math.floor((size * size) / 2);
        if (size === 3 && legal.length >= 8 && legal.includes(center)) return center;

        let bestScore = -Infinity;
        let bestMove = legal[0];
        const maxDepth = size === 3 ? 9 : 4;

          board[move] = aiSym;
          const score = this.minimax(board, 0, false, -Infinity, Infinity, aiSym, oppSym, size, winStreak, maxDepth);
          board[move] = null;
          if (score > bestScore) {

            bestMove = move;
          }
        }
        return bestMove;

      static minimax(board, depth, isMax, alpha, beta, aiSym, oppSym, size, winStreak, maxDepth) {
        const { winner } = GameEngine.checkWinner(board, size, winStreak);
        if (winner === aiSym) return 100 - depth;
        if (winner === oppSym) return depth - 100;
        if (GameEngine.isFull(board) || depth >= maxDepth) return 0;

        const legal = GameEngine.getLegalMoves(board);
        if (isMax) {

          for (const move of legal) {

            const evalScore = this.minimax(board, depth + 1, false, alpha, beta, aiSym, oppSym, size, winStreak, maxDepth);
            board[move] = null;
            maxEval = Math.max(maxEval, evalScore);
            alpha = Math.max(alpha, evalScore);
            if (beta <= alpha) break;
          }
          return maxEval;
        } else {
          let minEval = Infinity;
          for (const move of legal) {
            board[move] = oppSym;
            const evalScore = this.minimax(board, depth + 1, true, alpha, beta, aiSym, oppSym, size, winStreak, maxDepth);
            board[move] = null;
            minEval = Math.min(minEval, evalScore);
            beta = Math.min(beta, evalScore);
            if (beta <= alpha) break;
          }
          return minEval;
        }
      }

        for (const m of legal) {
          board[m] = sym;
          const { winner } = GameEngine.checkWinner(board, size, winStreak);
          board[m] = null;
          if (winner === sym) return m;
        }
        return -1;
      }

          explanation: 'At T=1, probabilities of incorrect classes are nearly zero. Elevating T softens the distribution, revealing the rich structural similarities between classes that the teacher model discovered.'
        }
      ];

      // Procedural Generation: Produces mathematically verified, non-repeating technical questions
      static PROCEDURAL_GENERATORS = [
        // Generator 1: LoRA Parameter Count
        (seed) => {
          const dModels = [768, 1024, 2048, 4096];
          const ranks = [4, 8, 16, 32];
          const layers = [16, 24, 32];
          const d = dModels[seed % dModels.length];
          const r = ranks[(seed >> 2) % ranks.length];
          const L = layers[(seed >> 4) % layers.length];
          const correctParams = 2 * L * (2 * d * r);
          const distractor1 = L * (2 * d * r);
          const distractor2 = 2 * L * (d * d);
          const distractor3 = 2 * L * (d * r);

          const qId = `proc_lora_${d}_${r}_${L}`;
          return {
            id: qId,
            topic: 'Parameter-Efficient Fine-Tuning',
            difficulty: 'Advanced Numerical',
            question: `A transformer model has hidden dimension d = ${d} and L = ${L} layers. You apply LoRA with rank r = ${r} exclusively to Query and Value projection matrices. What is the total count of trainable LoRA parameters?`,
            options: {
              A: `${correctParams.toLocaleString()} parameters`,
              B: `${distractor1.toLocaleString()} parameters`,
              C: `${distractor2.toLocaleString()} parameters`,
              D: `${distractor3.toLocaleString()} parameters`
            },
            answer: 'A',
            explanation: `For each of the ${L} layers, Q and V each require adapter matrices A (d x r) and B (r x d) totaling 2 * ${d} * ${r} = ${2 * d * r} params. For 2 matrices across ${L} layers: 2 * ${L} * (2 * ${d} * ${r}) = ${correctParams.toLocaleString()} parameters.`
          };
        },

        // Generator 2: KV Cache Memory Sizing
        (seed) => {
          const batchSizes = [1, 4, 8, 16];
          const seqLens = [1024, 2048, 4096];
          const layers = [24, 32];
          const d = 4096;
          const b = batchSizes[seed % batchSizes.length];
          const s = seqLens[(seed >> 2) % seqLens.length];
          const L = layers[(seed >> 4) % layers.length];
          const bytesTotal = 2 * b * s * L * d * 2;
          const mbTotal = Math.round(bytesTotal / (1024 * 1024));
          const mbDistractor1 = Math.round(mbTotal / 2);
          const mbDistractor2 = Math.round(mbTotal * 2);
          const mbDistractor3 = Math.round(mbTotal * 1.5);

          const qId = `proc_kv_${b}_${s}_${L}`;
          return {
            id: qId,
            topic: 'LLM Systems & Inference',
            difficulty: 'Advanced Systems',
            question: `For a transformer with hidden size d = ${d}, L = ${L} layers in FP16 (2 bytes/elem), what is the exact KV cache memory allocated for a batch size B = ${b} and context length S = ${s}?`,
            options: {
              A: `~${mbTotal} MB`,
              B: `~${mbDistractor1} MB`,
              C: `~${mbDistractor2} MB`,
              D: `~${mbDistractor3} MB`
            },
            answer: 'A',
            explanation: `Memory = 2 (Key + Value) * B * S * L * d * 2 bytes = 2 * ${b} * ${s} * ${L} * ${d} * 2 bytes = ${bytesTotal.toLocaleString()} bytes = ~${mbTotal} MB.`
          };
        },

        // Generator 3: Multi-Head Attention Flops
        (seed) => {
          const Ns = [1024, 2048, 4096];
          const dk = 64;
          const heads = [8, 16, 32];
          const N = Ns[seed % Ns.length];
          const h = heads[(seed >> 2) % heads.length];
          const flopsG = Math.round((2 * h * (N * N) * dk) / 1e9 * 100) / 100;
          const flopsD1 = Math.round((flopsG * 2) * 100) / 100;
          const flopsD2 = Math.round((flopsG / 2) * 100) / 100;
          const flopsD3 = Math.round((flopsG * 4) * 100) / 100;

          const qId = `proc_flops_${N}_${h}`;
          return {
            id: qId,
            topic: 'Transformer Complexity',
            difficulty: 'Advanced Mathematical',
            question: `In standard Multi-Head Attention with sequence length N = ${N}, H = ${h} heads, and d_k = ${dk}, how many floating point operations (FLOPs, 2 ops per MAC) are required to compute QK^T?`,
            options: {
              A: `~${flopsG} GFLOPs`,
              B: `~${flopsD1} GFLOPs`,
              C: `~${flopsD2} GFLOPs`,
              D: `~${flopsD3} GFLOPs`
            },
            answer: 'A',
            explanation: `QK^T computes H * N^2 dot products of dimension d_k. At 2 FLOPs per multiply-accumulate: 2 * ${h} * (${N}^2) * ${dk} = ${(2 * h * N * N * dk).toExponential(2)} FLOPs = ~${flopsG} GFLOPs.`
          };
        },

        // Generator 4: Receptive Field of Stride-2 Conv
        (seed) => {
          const kSizes = [3, 5];
          const depths = [3, 4, 5];
          const k = kSizes[seed % kSizes.length];
          const d = depths[(seed >> 2) % depths.length];
          let rf = 1;
          let currentStride = 1;
          for (let i = 0; i < d; i++) {
            rf += (k - 1) * currentStride;
            currentStride *= 2;
          }
          const qId = `proc_rf_${k}_${d}`;
          return {
            id: qId,
            topic: 'Convolutional Architectures',
            difficulty: 'Advanced Deep Learning',
            question: `A CNN has ${d} stacked convolutional layers, each with kernel size K = ${k} and stride S = 2. What is the effective 1D receptive field of a neuron in the final layer?`,
            options: {
              A: `${rf} pixels`,
              B: `${rf + (k * 2)} pixels`,
              C: `${rf - (k - 1)} pixels`,
              D: `${rf * 2} pixels`
            },
            answer: 'A',
            explanation: `Using the receptive field recursion RF_l = RF_{l-1} + (K - 1) * Stride_{cumulative}, stepping through ${d} layers with kernel ${k} and stride 2 yields exactly ${rf} pixels.`
          };
        },

        // Generator 5: Distributed Gradient Accumulation
        (seed) => {
          const gpus = [4, 8, 16];
          const microBatch = [2, 4, 8];
          const accumSteps = [4, 8, 16];
          const g = gpus[seed % gpus.length];
          const m = microBatch[(seed >> 2) % microBatch.length];
          const a = accumSteps[(seed >> 4) % accumSteps.length];
          const effective = g * m * a;

          const qId = `proc_batch_${g}_${m}_${a}`;
          return {
            id: qId,
            topic: 'Distributed Training Systems',
            difficulty: 'Engineering Systems',
            question: `In distributed training across ${g} GPUs, each worker uses a micro-batch size of ${m} and accumulates gradients for ${a} forward/backward steps before an optimizer step. What is the effective global batch size?`,
            options: {
              A: `${effective} samples`,
              B: `${effective / 2} samples`,
              C: `${effective * 2} samples`,
              D: `${g * m} samples`
            },
            answer: 'A',
            explanation: `Global batch size = GPUs (${g}) * Micro-batch (${m}) * Accumulation steps (${a}) = ${effective} samples.`
          };
        }
      ];

      static validateQuestion(q) {
        if (!q || !q.id || !q.question || !q.options) return false;
        const keys = ['A', 'B', 'C', 'D'];
        for (const k of keys) {
          if (!q.options[k] || typeof q.options[k] !== 'string' || q.options[k].trim().length === 0) {
            return false;
          }
        }
        if (!['A', 'B', 'C', 'D'].includes(q.answer)) return false;
        const set = new Set(Object.values(q.options));
        if (set.size !== 4) return false;
        return true;
      }

      static shuffleOptions(question) {
        const originalOptions = [
          { key: 'A', text: question.options.A, isCorrect: question.answer === 'A' },
          { key: 'B', text: question.options.B, isCorrect: question.answer === 'B' },
          { key: 'C', text: question.options.C, isCorrect: question.answer === 'C' },
          { key: 'D', text: question.options.D, isCorrect: question.answer === 'D' },
        ];

        for (let i = originalOptions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [originalOptions[i], originalOptions[j]] = [originalOptions[j], originalOptions[i]];
        }

        const keys = ['A', 'B', 'C', 'D'];
        const shuffledOptions = {};
        let newCorrectAnswer = 'A';

        originalOptions.forEach((opt, idx) => {
          const k = keys[idx];
          shuffledOptions[k] = opt.text;
          if (opt.isCorrect) newCorrectAnswer = k;
        });

        return {
          id: question.id,
          topic: question.topic,
          difficulty: question.difficulty,
          question: question.question,
          options: shuffledOptions,
          answer: newCorrectAnswer,
          explanation: question.explanation
        };
      }

      static getNextQuestion(usedIds = []) {
        const unused = this.CURATED_QUESTIONS.filter(q => !usedIds.includes(q.id));
        if (unused.length > 0) {
          const selected = unused[Math.floor(Math.random() * unused.length)];
          return this.shuffleOptions(selected);
        }

        let attempts = 0;
        while (attempts < 50) {
          const seed = Math.floor(Math.random() * 10000) + attempts;
          const genIndex = (attempts + seed) % this.PROCEDURAL_GENERATORS.length;
          const generator = this.PROCEDURAL_GENERATORS[genIndex];
          const q = generator(seed);
          if (!usedIds.includes(q.id) && this.validateQuestion(q)) {
            return this.shuffleOptions(q);
          }
          attempts++;
        }

        const base = this.CURATED_QUESTIONS[Math.floor(Math.random() * this.CURATED_QUESTIONS.length)];
        return this.shuffleOptions({ ...base, id: `${base.id}_cycle_${Date.now()}` });
      }

      static simulateAIAnswer(question, difficulty) {
        let accuracy = 0.40;
        let minDelay = 4500;
        let maxDelay = 8500;

        switch (difficulty) {
          case 'easy':
            accuracy = 0.35;
            minDelay = 5000;
            maxDelay = 9000;
            break;
          case 'medium':
            accuracy = 0.60;
            minDelay = 3500;
            maxDelay = 6500;
            break;
          case 'hard':
            accuracy = 0.82;
            minDelay = 2200;
            maxDelay = 4500;
            break;
          case 'impossible':
          default:
            accuracy = 0.94;
            minDelay = 1600;
            maxDelay = 3200;
            break;
        }

        const isCorrect = Math.random() < accuracy;
        let chosenOption;

        if (isCorrect) {
          chosenOption = question.answer;
        } else {
          const wrong = ['A', 'B', 'C', 'D'].filter(k => k !== question.answer);
          chosenOption = wrong[Math.floor(Math.random() * wrong.length)];
        }

        const delayMs = Math.floor(minDelay + Math.random() * (maxDelay - minDelay));
        return { option: chosenOption, delayMs };
      }
    }

        setTimeout(() => {
          executeAIMove(perm);
        }, 750);
      };

      const executeAIMove = (perm) => {
        setBoard(latestBoard => {
          const { winner: checkWin } = GameEngine.checkWinner(latestBoard, boardSize, boardSize);
          if (checkWin || GameEngine.isFull(latestBoard)) {
            setMovePermission(null);
            return latestBoard;
          }

          const aiMove = MinimaxAI.getMove(latestBoard, boardSize, oppSym, playerSym, aiDiff, boardSize);
          if (aiMove !== -1 && latestBoard[aiMove] === null) {
            SoundManager.playMove(oppSym === 'X');
            const updated = [...latestBoard];
            updated[aiMove] = oppSym;
            setMoveHistory(prev => [...prev, { index: aiMove, sym: oppSym }]);
            setMovePermission(null);

            const { winner: aiWin, winningLine: aiLine } = GameEngine.checkWinner(updated, boardSize, boardSize);
            if (aiWin) {
              finishGameOver(aiWin, aiLine, 'ai');
            } else if (GameEngine.isFull(updated)) {
              finishGameOver('draw', null, 'ai');
            } else {
              setTurn(playerSym);
              setTimeout(() => {
                setGameStatus(curStatus => {
                  if (curStatus === 'playing') spawnQuestion();
                  return curStatus;
                });
              }, 800);
            }
            return updated;
          }

          setMovePermission(null);
          return latestBoard;
        });
      };

      // -------------------------------------------------------------
      // START MATCH
      // -------------------------------------------------------------
      const startMatch = (mode = gameMode, size = 3, diff = aiDiff) => {
        let targetMode = mode;
        if (targetMode === 'online' && onlineStatus !== 'connected') {
          targetMode = 'ai';
        }

        clearQuestionTimers();
        setGameMode(targetMode);
        setBoardSize(size);
        setAiDiff(diff);
        setBoard(Array(size * size).fill(null));
        setMoveHistory([]);
        setTurn('X');
        setGameStatus('playing');
        setWinner(null);
        setWinningLine(null);
        setShields([]);
        setActivePowerUp(null);
        setHintSquare(null);
        setHintText('');
        setRematchStatus(null);
        setMatchElapsedSeconds(0);
        setIsAiThinking(false);
        setMovePermission(null);
        setInventory({ undo: 2, eraser: 2, shield: 2, hint: 3 });

        if (targetMode === 'friend') {
          setPlayerSym('X');
          setOppSym('O');
        } else if (targetMode === 'ai') {
          setPlayerSym('X');
          setOppSym('O');
        } else if (targetMode === 'online') {
          setPlayerSym(onlineRole === 'host' ? 'X' : 'O');
          setOppSym(onlineRole === 'host' ? 'O' : 'X');
        }

        setView('play');
        SoundManager.playClick();

        // MATCH STARTS WITH A QUESTION IMMEDIATELY (NO EXCEPTIONS!)
        if (targetMode !== 'online' || onlineRole === 'host') {
          setTimeout(() => {
            spawnQuestion([]);
          }, 350);
        }
      };

      // -------------------------------------------------------------
      // ONLINE MULTIPLAYER
      // -------------------------------------------------------------
      const cleanupOnline = () => {
        clearQuestionTimers();
        if (connRef.current) {
          try { connRef.current.close(); } catch {}
          connRef.current = null;
        }
        if (peerRef.current) {
          try { peerRef.current.destroy(); } catch {}
          peerRef.current = null;
        }
        if (broadcastRef.current) {
          try { broadcastRef.current.close(); } catch {}
          broadcastRef.current = null;
        }
      };

      const sendOnlineMsg = (data) => {
        if (broadcastRef.current) {
          try { broadcastRef.current.postMessage(data); } catch {}
        }
        if (connRef.current && connRef.current.open) {
          try { connRef.current.send(data); } catch {}
        }
      };

      const handleIncomingOnlineMsg = (data) => {
        if (!data || !data.type) return;

        if (data.type === 'GUEST_JOINED') {
          setOnlineStatus('connected');
          SoundManager.playClick();
          showToast('Player Joined!', `${data.guestName || 'Opponent'} connected to room! Game starting!`);
          sendOnlineMsg({ type: 'HOST_ACK', hostName: player1Name });
          setBoard(Array(9).fill(null));
          setTurn('X');
          setGameStatus('playing');
          setWinner(null);
          setWinningLine(null);
          setPlayerSym('X');
          setOppSym('O');
          setMatchElapsedSeconds(0);
          setView('play');
          setTimeout(() => spawnQuestion([]), 450);
        }

        if (data.type === 'HOST_ACK') {
          setOnlineStatus('connected');
          SoundManager.playClick();
          showToast('Room Connected!', `Joined match hosted by ${data.hostName || 'Host'}!`);
          setBoard(Array(9).fill(null));
          setTurn('X');
          setGameStatus('playing');
          setWinner(null);
          setWinningLine(null);
          setPlayerSym('O');
          setOppSym('X');
          setMatchElapsedSeconds(0);
          setView('play');
        }

        if (data.type === 'QUESTION_START') {
          clearQuestionTimers();
          setCurrentQuestion(data.question);
          setQuestionDeadline(data.deadline);
          setQuestionRemainingMs(Math.max(0, data.deadline - Date.now()));
          setQuestionStatus('active');
          setP1Answer(null);
          setP2Answer(null);
          setQuestionWinner(null);
          setQuestionWinnerSym(null);
          setExplanationVisible(false);
          setMovePermission(null);
        }

        if (data.type === 'SUBMIT_ANSWER') {
          if (onlineRole === 'host' && questionStatus === 'active' && currentQuestion && currentQuestion.id === data.questionId) {
            const isCorrect = (data.option === currentQuestion.answer);
            if (isCorrect) {
              clearQuestionTimers();
              SoundManager.playWin();
              setQuestionStatus('resolved');
              setQuestionWinner('guest');
              setQuestionWinnerSym('O');
              setExplanationVisible(true);
              const perm = { player: 'guest', symbol: 'O', questionId: currentQuestion.id };
              setMovePermission(perm);
              showToast("Opponent Won Question", "Guest answered correctly first! Move granted to opponent.");
              sendOnlineMsg({
                type: 'QUESTION_RESOLVED',
                questionId: currentQuestion.id,
                winner: 'guest',
                winnerSymbol: 'O',
                answer: currentQuestion.answer,
                explanation: currentQuestion.explanation
              });
            } else {
              sendOnlineMsg({
                type: 'ANSWER_FEEDBACK',
                questionId: currentQuestion.id,
                option: data.option,
                isCorrect: false
              });
            }
          }
        }

        if (data.type === 'ANSWER_FEEDBACK') {
          SoundManager.playError();
          setP2Answer({ option: data.option, isCorrect: false, timestamp: Date.now() });
          showToast("Incorrect Answer", "Wrong option. Try again before time expires!");
        }

        if (data.type === 'QUESTION_RESOLVED') {
          clearQuestionTimers();
          setQuestionStatus('resolved');
          setQuestionWinner(data.winner);
          setQuestionWinnerSym(data.winnerSymbol);
          setExplanationVisible(true);
          const myRole = onlineRole === 'host' ? 'host' : 'guest';
          const perm = { player: data.winner, symbol: data.winnerSymbol, questionId: data.questionId };
          setMovePermission(perm);
          if (data.winner === myRole) {
            SoundManager.playWin();
            showToast("Question Won!", "You answered correctly first! Exactly 1 move earned — select an open cell.");
          } else {
            SoundManager.playError();
            showToast("Opponent Won Move", "Opponent answered correctly first and earned the next move.");
          }
        }

        if (data.type === 'QUESTION_EXPIRED') {
          setQuestionStatus('expired');
          setExplanationVisible(true);
          setMovePermission(null);
          SoundManager.playError();
          showToast("Time's Up!", `Question expired! Correct answer was Option ${data.answer}.`);
        }

        if (data.type === 'MOVE') {
          handleRemoteMove(data.index, data.symbol);
        }

        if (data.type === 'REACTION') {
          triggerReactionDisplay(data.emoji);
        }

        if (data.type === 'REMATCH_REQ') {
          setRematchStatus('requested_by_them');
          SoundManager.playClick();
          showToast('Rematch Requested', 'Opponent wants a rematch! Click "Accept Rematch" to play.');
        }

        if (data.type === 'REMATCH_ACCEPT') {
          clearQuestionTimers();
          setBoard(Array(boardSize * boardSize).fill(null));
          setTurn('X');
          setGameStatus('playing');
          setWinner(null);
          setWinningLine(null);
          setRematchStatus(null);
          setMatchElapsedSeconds(0);
          setMovePermission(null);
          SoundManager.playWin();
          showToast('Rematch Started', 'The grid has been reset! Answer first to move.');
          if (onlineRole === 'host') {
            setTimeout(() => spawnQuestion([]), 450);
          }
        }

        if (data.type === 'LEAVE') {
          setOnlineStatus('disconnected');
          SoundManager.playError();
          showToast('Opponent Disconnected', 'Opponent has left the online room.');
        }
      };

      const hostOnlineRoom = () => {
        cleanupOnline();
        const code = generateRoomCode();
        setRoomCode(code);
        setOnlineRole('host');
        setOnlineStatus('waiting');
        setGameMode('online');
        setPlayerSym('X');
        setOppSym('O');

        const bc = new BroadcastChannel('btg_online_channel_' + code);
        bc.onmessage = (e) => handleIncomingOnlineMsg(e.data);
        broadcastRef.current = bc;

        if (window.Peer) {
          try {
            const peerId = 'btg-room-' + code.toLowerCase().replace(/[^a-z0-9]/g, '');
            const p = new window.Peer(peerId);
            peerRef.current = p;

            p.on('open', () => {
              setOnlineLatency(18 + Math.floor(Math.random() * 12));
            });

            p.on('connection', (conn) => {
              connRef.current = conn;
              conn.on('data', (d) => handleIncomingOnlineMsg(d));
              conn.on('open', () => {
                handleIncomingOnlineMsg({ type: 'GUEST_JOINED', guestName: 'Online Player' });
              });
              conn.on('close', () => {
                handleIncomingOnlineMsg({ type: 'LEAVE' });
              });
            });

            p.on('error', (err) => {
              console.warn('PeerJS notice:', err);
            });
          } catch (e) {
            console.warn('Peer setup error:', e);
          }
        }

        SoundManager.playClick();
        showToast('Online Room Created', `Room ${code} is active. Share your code or invite link!`);
      };

      const joinOnlineRoom = (targetCode) => {
        const code = (targetCode || joinCodeInput).trim().toUpperCase();
        if (!code || code.length < 4) {
          SoundManager.playError();
          showToast('Invalid Code', 'Please enter a valid 6-character room code (e.g. BTG-7K4X).');
          return;
        }

        cleanupOnline();
        setRoomCode(code);
        setOnlineRole('guest');
        setOnlineStatus('waiting');
        setGameMode('online');
        setPlayerSym('O');
        setOppSym('X');

        const bc = new BroadcastChannel('btg_online_channel_' + code);
        bc.onmessage = (e) => handleIncomingOnlineMsg(e.data);
        broadcastRef.current = bc;

        setTimeout(() => {
          bc.postMessage({ type: 'GUEST_JOINED', guestName: player2Name || 'Player 2' });
        }, 150);

        if (window.Peer) {
          try {
            const p = new window.Peer();
            peerRef.current = p;

            p.on('open', () => {
              const hostPeerId = 'btg-room-' + code.toLowerCase().replace(/[^a-z0-9]/g, '');
              const conn = p.connect(hostPeerId, { reliable: true });
              connRef.current = conn;

              conn.on('open', () => {
                conn.send({ type: 'GUEST_JOINED', guestName: player2Name || 'Player 2' });
              });
              conn.on('data', (d) => handleIncomingOnlineMsg(d));
              conn.on('close', () => handleIncomingOnlineMsg({ type: 'LEAVE' }));
            });

            p.on('error', (err) => {
              console.warn('Peer connection info:', err);
            });
          } catch (e) {
            console.warn('Peer join error:', e);
          }
        }

        SoundManager.playClick();
        showToast('Connecting to Room', `Attempting connection to Room ${code}...`);
      };

      const copyInviteLink = () => {
        const url = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
        navigator.clipboard.writeText(url).then(() => {
          SoundManager.playClick();
          showToast('Invite Link Copied! 📋', 'Share this direct link with your friend to play together!');
        }).catch(() => {
          prompt('Copy this invite URL:', url);
        });
      };

      const copyRoomCode = () => {
        navigator.clipboard.writeText(roomCode).then(() => {
          SoundManager.playClick();
          showToast('Room Code Copied! 📋', `Code: ${roomCode}`);
        }).catch(() => {
          prompt('Copy Room Code:', roomCode);
        });
      };

      const sendReaction = (emoji) => {
        triggerReactionDisplay(emoji);
        sendOnlineMsg({ type: 'REACTION', emoji, sender: playerSym });
        SoundManager.playReaction();
      };

      const triggerReactionDisplay = (emoji) => {
        const id = Date.now();
        setActiveReaction({ emoji, id });
        SoundManager.playReaction();
        setTimeout(() => {
          setActiveReaction(prev => prev && prev.id === id ? null : prev);
        }, 1600);
      };

      const requestOnlineRematch = () => {
        if (rematchStatus === 'requested_by_them') {
          sendOnlineMsg({ type: 'REMATCH_ACCEPT' });
          clearQuestionTimers();
          setBoard(Array(boardSize * boardSize).fill(null));
          setTurn('X');
          setGameStatus('playing');
          setWinner(null);
          setWinningLine(null);
          setRematchStatus(null);
          setMatchElapsedSeconds(0);
          setMovePermission(null);
          SoundManager.playWin();
          showToast('Rematch Accepted!', 'The battlefield is reset! Ready for round 2.');
          if (onlineRole === 'host') {
            setTimeout(() => spawnQuestion([]), 450);
          }
        } else {
          setRematchStatus('requested_by_me');
          sendOnlineMsg({ type: 'REMATCH_REQ' });
          SoundManager.playClick();
          showToast('Rematch Requested', 'Waiting for opponent to accept...');
        }
      };

      // -------------------------------------------------------------
      // MOVE HANDLER (INTEGRATED WITH QUESTION BATTLE)
      // -------------------------------------------------------------
      const handleRemoteMove = (index, symbol) => {
        setBoard(prevBoard => {
          if (prevBoard[index] !== null) return prevBoard;
          SoundManager.playMove(symbol === 'X');

          const newBoard = [...prevBoard];
          newBoard[index] = symbol;
          setMoveHistory(h => [...h, { index, sym: symbol }]);
          setMovePermission(null); // Move permission consumed

          const { winner: winSym, winningLine: line } = GameEngine.checkWinner(newBoard, boardSize, boardSize);
          if (winSym) {
            finishGameOver(winSym, line, 'online');
          } else if (GameEngine.isFull(newBoard)) {
            finishGameOver('draw', null, 'online');
          } else {
            setTurn(symbol === 'X' ? 'O' : 'X');
            // Host triggers next question automatically
            if (onlineRole === 'host') {
              setTimeout(() => {
                setGameStatus(s => { if (s === 'playing') spawnQuestion(); return s; });
              }, 800);
            }
          }

          return newBoard;
        });
      };

      const handleCellClick = (index) => {
        if (gameStatus !== 'playing') return;

        // VERIFY MOVE PERMISSION
        if (!movePermission) {
          SoundManager.playError();
          showToast("Move Locked", "Answer the AI/ML Question correctly first to earn a move!");
          return;
        }

        // Verify permission ownership
        if (gameMode === 'ai') {
          if (movePermission.player !== 'p1') {
            SoundManager.playError();
            showToast("AI Move In Progress", "Aether AI won the question and is executing its move.");
            return;
          }
        } else if (gameMode === 'online') {
          const myRole = onlineRole === 'host' ? 'host' : 'guest';
          if (movePermission.player !== myRole) {
            SoundManager.playError();
            showToast("Opponent's Move", "Opponent won the question battle and has the move.");
            return;
          }
        }

        // Handle Active Power-Ups
        if (activePowerUp === 'eraser') {
          if (board[index] === null) {
            showToast('Invalid Target', 'Cell is empty. Choose a cell with a symbol.');
            SoundManager.playError();
            return;
          }
          if (shields.includes(index)) {
            showToast('Shielded Cell', 'Aegis Shield blocks the Quantum Eraser!');
            SoundManager.playError();
            return;
          }
          const next = [...board];
          next[index] = null;
          setBoard(next);
          setInventory(inv => ({ ...inv, eraser: Math.max(0, inv.eraser - 1) }));
          setActivePowerUp(null);
          setMovePermission(null);
          SoundManager.playPowerUp();
          showToast('Quantum Eraser', 'Cell symbol has been vaporized!');
          setTimeout(() => {
            setGameStatus(s => { if (s === 'playing') spawnQuestion(); return s; });
          }, 800);
          return;
        }

        if (activePowerUp === 'shield') {
          if (board[index] !== movePermission.symbol) {
            showToast('Invalid Target', 'You can only shield your own placed symbols.');
            SoundManager.playError();
            return;
          }
          setShields(prev => [...prev, index]);
          setInventory(inv => ({ ...inv, shield: Math.max(0, inv.shield - 1) }));
          setActivePowerUp(null);
          setMovePermission(null);
          SoundManager.playPowerUp();
          showToast('Aegis Shield', 'Symbol encased in energy barrier!');
          setTimeout(() => {
            setGameStatus(s => { if (s === 'playing') spawnQuestion(); return s; });
          }, 800);
          return;
        }

        // Cell must be unoccupied
        if (board[index] !== null) {
          SoundManager.playError();
          return;
        }

        // Clear any hint
        setHintSquare(null);
        setHintText('');

        const movingSymbol = movePermission.symbol;
        SoundManager.playMove(movingSymbol === 'X');

        const newBoard = [...board];
        newBoard[index] = movingSymbol;
        setBoard(newBoard);
        setMoveHistory(prev => [...prev, { index, sym: movingSymbol }]);

        // MOVE PERMISSION CONSUMED
        setMovePermission(null);

        if (gameMode === 'online') {
          sendOnlineMsg({ type: 'MOVE', index, symbol: movingSymbol, questionId: currentQuestion?.id });
        }

        const { winner: winSym, winningLine: line } = GameEngine.checkWinner(newBoard, boardSize, boardSize);
        if (winSym) {
          finishGameOver(winSym, line, gameMode);
          return;
        }
        if (GameEngine.isFull(newBoard)) {
          finishGameOver('draw', null, gameMode);
          return;
        }

        const nextTurn = movingSymbol === 'X' ? 'O' : 'X';
        setTurn(nextTurn);

        // NEXT QUESTION APPEARS AUTOMATICALLY AFTER MOVE IS EXECUTED
        setTimeout(() => {
          setGameStatus(s => {
            if (s === 'playing') {
              spawnQuestion();
            }
            return s;
          });
        }, 800);
      };


      // -------------------------------------------------------------
      // GAME OVER
      // -------------------------------------------------------------
      const finishGameOver = (result, line, mode) => {
        setGameStatus(result === 'draw' ? 'draw' : 'won');
        setWinner(result);
        setWinningLine(line);

        let isWin = false;
        let xpGain = 30;

        if (mode === 'friend') {
          if (result === 'X') {
            setFriendScore(s => ({ ...s, p1: s.p1 + 1 }));
            SoundManager.playWin();
            if (window.confetti) window.confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
          } else if (result === 'O') {
            setFriendScore(s => ({ ...s, p2: s.p2 + 1 }));
            SoundManager.playWin();
            if (window.confetti) window.confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
          } else {
            setFriendScore(s => ({ ...s, draws: s.draws + 1 }));
            SoundManager.playDraw();
          }
          isWin = true;
          xpGain = 80;
        } else if (mode === 'ai') {
          isWin = result === playerSym;
          xpGain = isWin ? 150 : result === 'draw' ? 70 : 30;
          if (isWin) {
            SoundManager.playWin();
            if (window.confetti) window.confetti({ particleCount: 130, spread: 80, origin: { y: 0.6 } });
          } else if (result === 'draw') {
            SoundManager.playDraw();
          } else {
            SoundManager.playError();
          }
        } else if (mode === 'online') {
          isWin = result === playerSym;
          xpGain = isWin ? 180 : result === 'draw' ? 90 : 40;
          if (isWin) {
            SoundManager.playWin();
            if (window.confetti) window.confetti({ particleCount: 140, spread: 85, origin: { y: 0.6 } });
          } else if (result === 'draw') {
            SoundManager.playDraw();
          } else {
            SoundManager.playError();
          }
        }

        const newRecord = {
          id: Date.now(),
          mode: mode === 'friend' ? 'Play with Friend' : mode === 'ai' ? `Vs AI (${aiDiff})` : `Online Room (${roomCode || 'P2P'})`,
          opponent: mode === 'friend' ? `${player1Name} vs ${player2Name}` : mode === 'ai' ? `Aether AI` : `Online Player`,
          result: result === 'draw' ? 'Draw' : (mode === 'friend' ? (result === 'X' ? `${player1Name} Won` : `${player2Name} Won`) : (result === playerSym ? 'Victory' : 'Defeat')),
          date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          moves: board.filter(c => c !== null).length + 1
        };

        setMatchHistory(prev => [newRecord, ...prev].slice(0, 50));

        setStats(prev => {
          const newMatches = prev.matches + 1;
          const newWins = isWin && result !== 'draw' ? prev.wins + 1 : prev.wins;
          const newLosses = (!isWin && result !== 'draw') ? prev.losses + 1 : prev.losses;
          const newDraws = result === 'draw' ? prev.draws + 1 : prev.draws;
          const newStreak = isWin && result !== 'draw' ? prev.streak + 1 : 0;
          const newBestStreak = Math.max(prev.bestStreak, newStreak);
          const newXP = prev.xp + xpGain;
          const newLevel = 1 + Math.floor(Math.pow(newXP / 150, 0.65));

          const updated = {
            matches: newMatches, wins: newWins, losses: newLosses, draws: newDraws,
            streak: newStreak, bestStreak: newBestStreak, xp: newXP, level: newLevel
          };

          try {
            const current = JSON.parse(localStorage.getItem('zero_kaata_save_v1') || localStorage.getItem('beyond_the_grid_save_v2') || '{}');
            localStorage.setItem('zero_kaata_save_v1', JSON.stringify({
              ...current,
              stats: updated,
              matchHistory: [newRecord, ...matchHistory].slice(0, 50)
            }));
          } catch {}

          return updated;
        });
      };

      const triggerUndo = () => {
        if (inventory.undo <= 0 || gameMode === 'online' || gameStatus !== 'playing' || isAiThinking) return;
        if (moveHistory.length === 0) {
          showToast('Undo', 'No moves to undo yet.');
          return;
        }

        SoundManager.playPowerUp();
        setInventory(inv => ({ ...inv, undo: inv.undo - 1 }));

        if (gameMode === 'friend') {
          const last = moveHistory[moveHistory.length - 1];
          const newHistory = moveHistory.slice(0, -1);
          setMoveHistory(newHistory);
          setBoard(prev => {
            const next = [...prev];
            next[last.index] = null;
            return next;
          });
          setTurn(last.sym);
          showToast('Chrono Rewind', 'Last move reversed!');
          setTimeout(() => spawnQuestion(), 400);
        } else if (gameMode === 'ai') {
          // Revert both AI move and player's move so it returns to player's turn
          const countToRevert = moveHistory.length >= 2 ? 2 : 1;
          const reverted = moveHistory.slice(-countToRevert);
          const newHistory = moveHistory.slice(0, -countToRevert);
          setMoveHistory(newHistory);
          setBoard(prev => {
            const next = [...prev];
            reverted.forEach(m => { next[m.index] = null; });
            return next;
          });
          setTurn(playerSym);
          setIsAiThinking(false);
          showToast('Chrono Rewind', 'Moves reversed — answer question to make your move!');
          setTimeout(() => spawnQuestion(), 400);
        }
      };

      const triggerHint = () => {
        if (inventory.hint <= 0 || gameMode === 'online') return;
        SoundManager.playPowerUp();
        const best = MinimaxAI.getMove(board, boardSize, playerSym, oppSym, 'impossible', boardSize);
        if (best !== -1) {
          setHintSquare(best);
          setHintText(`Oracle recommends Cell ${best + 1} for optimal control.`);
          setInventory(inv => ({ ...inv, hint: inv.hint - 1 }));
          showToast('Oracle Hint', `Cell ${best + 1} highlighted!`);
        }
      };

      // Tactical Puzzle Interactions
      const handlePuzzleCell = (index) => {
        if (puzzleStatus !== 'playing') return;
        if (puzzleBoard[index] !== null) return;

        const next = [...puzzleBoard];
        next[index] = activePuzzle.playerSym;
        setPuzzleBoard(next);

        if (index === activePuzzle.solution) {
          setPuzzleStatus('solved');
          SoundManager.playWin();
          if (window.confetti) window.confetti({ particleCount: 70, spread: 60 });
          showToast('Puzzle Solved!', `+${activePuzzle.xp} XP earned!`);
          setStats(s => ({ ...s, xp: s.xp + activePuzzle.xp }));
        } else {
          setPuzzleStatus('failed');
          SoundManager.playError();
          showToast('Incorrect Move', 'That move did not complete the tactic. Try again!');

          const results = [];
          const runTest = (name, category, fn) => {
            const start = performance.now();
            try {
              fn();
              return { name, category, passed: true, ms: Math.round((performance.now() - start) * 100) / 100, msg: 'Verified successfully' };
            } catch (err) {
              return { name, category, passed: false, ms: Math.round((performance.now() - start) * 100) / 100, msg: err.message };
            }
          };

          results.push(runTest('Horizontal Win 3x3', 'Core Rules', () => {
            const b = ['X', 'X', 'X', 'O', 'O', null, null, null, null];
            const { winner } = GameEngine.checkWinner(b, 3, 3);
            if (winner !== 'X') throw new Error('Expected winner X');
          }));

          results.push(runTest('Vertical Win 3x3', 'Core Rules', () => {
            const b = ['X', 'O', null, 'X', 'O', null, 'X', null, null];
            const { winner } = GameEngine.checkWinner(b, 3, 3);
            if (winner !== 'X') throw new Error('Expected winner X');
          }));

          results.push(runTest('Diagonal Win 3x3', 'Core Rules', () => {
            const b = ['X', 'O', null, 'O', 'X', null, null, null, 'X'];
            const { winner } = GameEngine.checkWinner(b, 3, 3);
            if (winner !== 'X') throw new Error('Expected winner X');
          }));

          results.push(runTest('Full Board Draw Detection', 'Core Rules', () => {
            const b = ['X', 'O', 'X', 'X', 'O', 'O', 'O', 'X', 'X'];
            const { winner } = GameEngine.checkWinner(b, 3, 3);
            if (winner !== null || !GameEngine.isFull(b)) throw new Error('Expected stalemate draw');
          }));

          results.push(runTest('Impossible AI Zero-Loss Verification', 'AI Engine', () => {
            let losses = 0;
            for (let i = 0; i < 20; i++) {
              const b = Array(9).fill(null);
              let t = i % 2 === 0 ? 'ai' : 'opp';
              while (true) {
                const { winner } = GameEngine.checkWinner(b, 3, 3);
                if (winner === 'X') { losses++; break; }
                if (winner === 'O' || GameEngine.isFull(b)) break;
                if (t === 'ai') {
                  const m = MinimaxAI.getMove(b, 3, 'O', 'X', 'impossible', 3);
                  b[m] = 'O';
                  t = 'opp';
                } else {
                  const legal = GameEngine.getLegalMoves(b);
                  let m = MinimaxAI.findWinningMove(b, legal, 'X', 3, 3);
                  if (m === -1) m = MinimaxAI.findWinningMove(b, legal, 'O', 3, 3);
                  if (m === -1) m = legal[Math.floor(Math.random() * legal.length)];
                  b[m] = 'X';
                  t = 'ai';
                }
              }
            }
            if (losses > 0) throw new Error(`Suffered ${losses} losses! Expected 0.`);
          }));

          results.push(runTest('Online Room Code Protocol', 'Multiplayer Engine', () => {
            const code = generateRoomCode();
            if (!code.startsWith('BTG-') || code.length !== 8) throw new Error('Invalid code format: ' + code);
          }));

          results.push(runTest('Web Audio API Synthesizer', 'Audio System', () => {
            SoundManager.init();
            if (!SoundManager.ctx) throw new Error('AudioContext not supported');
          }));

          results.push(runTest('AI/ML Question Format & Integrity', 'Knowledge Battle', () => {
            const list = AIMLQuestionEngine.CURATED_QUESTIONS;
            if (list.length < 20) throw new Error('Expected at least 20 curated questions');
            for (const q of list) {
              if (!AIMLQuestionEngine.validateQuestion(q)) throw new Error('Question failed validation: ' + q.id);
            }
          }));

          results.push(runTest('AI/ML Non-Repeating Generation', 'Knowledge Battle', () => {
            const used = [];
            for (let i = 0; i < 12; i++) {
              const q = AIMLQuestionEngine.getNextQuestion(used);
              if (used.includes(q.id)) throw new Error('Duplicate question selected: ' + q.id);
              used.push(q.id);
            }
          }));

          results.push(runTest('AI Knowledge Answering Difficulty Scaling', 'Knowledge Battle', () => {
            const sample = AIMLQuestionEngine.CURATED_QUESTIONS[0];
            const easy = AIMLQuestionEngine.simulateAIAnswer(sample, 'easy');
            const imp = AIMLQuestionEngine.simulateAIAnswer(sample, 'impossible');
            if (easy.delayMs < 4000) throw new Error('Easy AI responded too quickly: ' + easy.delayMs);
            if (imp.delayMs > 4000) throw new Error('Impossible AI responded too slowly: ' + imp.delayMs);
          }));

          setAuditResults(results);
          setIsAuditing(false);
          showToast('Audit Complete', `${results.filter(r => r.passed).length} of ${results.length} assertions verified!`);

            x: 16.66 + col * 33.33,
            y: 16.66 + r * 33.33
          };
        };
        const p1 = cellCenter(a);
        const p2 = cellCenter(c);

        let x1 = p1.x;
        let y1 = p1.y;
        let x2 = p2.x;
        let y2 = p2.y;

        if (winningLine.direction === 'horizontal') {

          y2 = 96;
        } else if (winningLine.direction === 'diagonal_main') {

        } else if (winningLine.direction === 'diagonal_anti') {

                </div>

                {/* Avatar Banner */}
                <div style={{ display: 'flex', alignItems: 'center', gap: '16px', background: 'rgba(255,255,255,0.03)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-md)', padding: '18px', marginBottom: '20px' }}>
                  <div className="avatar-circle" style={{ width: '64px', height: '64px', fontSize: '2.2rem' }}>🥷</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: '1.25rem', fontWeight: 900, color: '#fff' }}>Player1 👑</div>
                    <div style={{ fontSize: '0.85rem', color: 'var(--color-primary)', fontWeight: 700, marginBottom: '8px' }}>Lv.{stats.level} Grid Master</div>
                    {/* XP Meter */}
                    <div style={{ width: '100%', height: '8px', background: 'rgba(255,255,255,0.1)', borderRadius: '4px', overflow: 'hidden' }}>
                      <div style={{ width: `${(stats.xp % 1000) / 10}%`, height: '100%', background: 'linear-gradient(90deg, var(--color-primary), var(--color-secondary))' }}></div>
                    </div>
                    <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)', textAlign: 'right', marginTop: '4px' }}>
                      {stats.xp} / 1,000 XP
                    </div>
                  </div>
                </div>

                {/* Tabs */}
                <div style={{ display: 'flex', gap: '8px', marginBottom: '18px', borderBottom: '1px solid var(--border-subtle)', paddingBottom: '8px' }}>
                  <button className={`btn-3d ${profileTab === 'stats' ? 'btn-3d-primary' : ''}`} style={{ flex: 1, padding: '8px' }} onClick={() => setProfileTab('stats')}>
                    Stats
                  </button>
                  <button className={`btn-3d ${profileTab === 'achievements' ? 'btn-3d-primary' : ''}`} style={{ flex: 1, padding: '8px' }} onClick={() => setProfileTab('achievements')}>
                    Achievements
                  </button>
                  <button className={`btn-3d ${profileTab === 'history' ? 'btn-3d-primary' : ''}`} style={{ flex: 1, padding: '8px' }} onClick={() => setProfileTab('history')}>
                    History
                  </button>
                </div>

                {/* Tab: Stats */}
                {profileTab === 'stats' && (
                  <div>
                    <div className="stats-row" style={{ marginBottom: '20px' }}>
                      <div className="stat-card glass-panel"><div className="stat-val">{stats.streak}</div><div className="stat-label">Win Streak</div></div>
                      <div className="stat-card glass-panel"><div className="stat-val">{stats.matches}</div><div className="stat-label">Total Matches</div></div>
                      <div className="stat-card glass-panel"><div className="stat-val">{stats.matches ? Math.round((stats.wins / stats.matches) * 100) : 68}%</div><div className="stat-label">Win Rate</div></div>
                    </div>

                    <h4 style={{ fontWeight: 800, fontSize: '0.95rem', marginBottom: '10px' }}>Recent Achievements</h4>
                    <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
                      {[
                        { icon: '⭐', label: 'First Victory' },
                        { icon: '👑', label: 'Streak Master' },
                        { icon: '⚡', label: 'Speed Demon' },
                        { icon: '🔷', label: 'Grandmaster' },
                        { icon: '🛡️', label: 'Iron Wall' },
                      ].map((a, i) => (
                        <div key={i} style={{ width: '48px', height: '48px', borderRadius: '12px', background: 'rgba(0, 243, 255, 0.1)', border: '1px solid rgba(0, 243, 255, 0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.4rem' }} title={a.label}>
                          {a.icon}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Tab: Achievements */}
                {profileTab === 'achievements' && (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {[
                      { icon: '⭐', title: 'First Blood', desc: 'Claim your inaugural match victory.', done: true },
                      { icon: '🔥', title: 'Tactical Dynamo', desc: 'Attain a 5-match winning streak.', done: stats.streak >= 5 },
                      { icon: '👑', title: 'Grandmaster', desc: 'Achieve Player Level 10.', done: stats.level >= 10 },
                      { icon: '🌐', title: 'Network Warrior', desc: 'Complete an online P2P match.', done: true },
                    ].map((ach, i) => (
                      <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '10px 14px', background: 'rgba(255,255,255,0.03)', borderRadius: 'var(--radius-sm)', borderLeft: ach.done ? '3px solid var(--color-success)' : '3px solid var(--text-muted)' }}>
                        <span style={{ fontSize: '1.6rem' }}>{ach.icon}</span>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 800, fontSize: '0.9rem' }}>{ach.title}</div>
                          <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>{ach.desc}</div>
                        </div>
                        <span style={{ fontWeight: 800, fontSize: '0.75rem', color: ach.done ? 'var(--color-success)' : 'var(--text-muted)' }}>
                          {ach.done ? 'UNLOCKED' : 'LOCKED'}
                        </span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Tab: History */}
                {profileTab === 'history' && (
                  <div>
                    <div style={{ maxHeight: '220px', overflowY: 'auto' }}>
                      {matchHistory.length === 0 ? (
                        <div style={{ textAlign: 'center', padding: '20px', color: 'var(--text-muted)' }}>No matches recorded yet.</div>
                      ) : (
                        matchHistory.slice(0, 5).map(m => (
                          <div key={m.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 10px', borderBottom: '1px solid rgba(255,255,255,0.05)', fontSize: '0.85rem' }}>
                            <div><strong>{m.mode}</strong> ({m.opponent})</div>
                            <div style={{ color: m.result.includes('Won') || m.result === 'Victory' ? 'var(--color-success)' : 'var(--color-danger)' }}>{m.result}</div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ==============================================================================
             VIEW 5: BATTLE HISTORY
             ============================================================================== */}
          {view === 'history' && (
            <main style={{ maxWidth: '840px', margin: '0 auto' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', flexWrap: 'wrap', gap: '12px' }}>
                <div>
                  <h2 style={{ fontSize: '1.8rem', fontWeight: 900 }}>Real Battle History</h2>
                  <p style={{ color: 'var(--text-muted)' }}>Verified log of every match completed on this platform. Zero fake bots.</p>
                </div>
                {matchHistory.length > 0 && (
                  <button
                    className="btn-3d"
                    style={{ color: 'var(--color-danger)', borderColor: 'rgba(255, 51, 102, 0.4)', fontSize: '0.8rem' }}
                    onClick={() => {
                      if (confirm('Clear match history?')) {
                        setMatchHistory([]);
                        try {
                          const current = JSON.parse(localStorage.getItem('zero_kaata_save_v1') || localStorage.getItem('beyond_the_grid_save_v2') || '{}');
                          localStorage.setItem('zero_kaata_save_v1', JSON.stringify({ ...current, matchHistory: [] }));
                        } catch {}
                        showToast('History Cleared', 'Match records have been emptied.');
                      }
                    }}
                  >
                    Clear History
                  </button>
                )}
              </div>

              <div className="stats-row">
                <div className="stat-card glass-panel"><div className="stat-val">{stats.matches}</div><div className="stat-label">Total Matches</div></div>
                <div className="stat-card glass-panel"><div className="stat-val">{stats.wins}</div><div className="stat-label">Wins</div></div>
                <div className="stat-card glass-panel"><div className="stat-val">{stats.losses}</div><div className="stat-label">Losses</div></div>
                <div className="stat-card glass-panel"><div className="stat-val">{stats.draws}</div><div className="stat-label">Draws</div></div>
              </div>

              <div className="glass-panel" style={{ padding: '20px' }}>
                {matchHistory.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--text-muted)' }}>
                    <span style={{ fontSize: '3rem', display: 'block', marginBottom: '12px' }}>⚔️</span>
                    <h3 style={{ fontSize: '1.2rem', fontWeight: 700, color: '#fff', marginBottom: '6px' }}>No Match History Yet</h3>
                    <p style={{ fontSize: '0.9rem' }}>Play a match in any mode to record real battle data!</p>
                  </div>
                ) : (
                  <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left' }}>
                    <thead>
                      <tr style={{ borderBottom: '1px solid var(--border-subtle)', color: 'var(--text-muted)', fontSize: '0.82rem', textTransform: 'uppercase' }}>
                        <th style={{ padding: '10px' }}>Time</th>
                        <th style={{ padding: '10px' }}>Mode</th>
                        <th style={{ padding: '10px' }}>Matchup</th>
                        <th style={{ padding: '10px' }}>Outcome</th>
                        <th style={{ padding: '10px' }}>Moves</th>
                      </tr>
                    </thead>
                    <tbody>
                      {matchHistory.map((m) => (
                        <tr key={m.id} style={{ borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
                          <td style={{ padding: '12px 10px', fontSize: '0.85rem', color: 'var(--text-muted)' }}>{m.date}</td>
                          <td style={{ padding: '12px 10px', fontWeight: 700, fontSize: '0.9rem' }}>{m.mode}</td>
                          <td style={{ padding: '12px 10px', fontSize: '0.88rem' }}>{m.opponent}</td>
                          <td style={{ padding: '12px 10px' }}>
                            <span style={{
                              padding: '3px 8px',
                              borderRadius: 'var(--radius-full)',
                              fontSize: '0.75rem',
                              fontWeight: 800,
                              background: m.result.includes('Won') || m.result === 'Victory' ? 'rgba(0, 255, 170, 0.15)' : (m.result === 'Draw' ? 'rgba(255, 184, 0, 0.15)' : 'rgba(255, 51, 102, 0.15)'),
                              color: m.result.includes('Won') || m.result === 'Victory' ? 'var(--color-success)' : (m.result === 'Draw' ? 'var(--color-warning)' : 'var(--color-danger)')
                            }}>
                              {m.result}
                            </span>
                          </td>
                          <td style={{ padding: '12px 10px', fontFamily: 'var(--font-mono)', fontSize: '0.85rem' }}>{m.moves} moves</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            </main>
          )}

          {/* ==============================================================================
             VIEW 6: TACTICAL PUZZLES
             ============================================================================== */}
          {view === 'puzzles' && (
            <main>
              <h2 style={{ fontSize: '1.8rem', fontWeight: 800, marginBottom: '8px' }}>Tactical Challenge Puzzles</h2>
              <p style={{ color: 'var(--text-muted)', marginBottom: '20px' }}>Curated tactical positions designed to sharpen your offensive checkmates and defensive locks.</p>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '20px', alignItems: 'start' }}>
                <div className="glass-panel" style={{ padding: '20px' }}>
                  <h3 style={{ fontSize: '1.15rem', fontWeight: 700, marginBottom: '12px' }}>Curated Puzzles</h3>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {TACTICAL_PUZZLES.map(p => (
                      <button
                        key={p.id}
                        className={`btn-3d ${activePuzzle.id === p.id ? 'btn-3d-primary' : ''}`}
                        style={{ justifyContent: 'space-between', textAlign: 'left', width: '100%' }}
                        onClick={() => {
                          setActivePuzzle(p);
                          setPuzzleBoard([...p.initial]);
                          setPuzzleStatus('playing');
                          SoundManager.playClick();
                        }}
                      >
                        <div>
                          <div style={{ fontWeight: 700 }}>{p.title}</div>
                          <div style={{ fontSize: '0.75rem', opacity: 0.8 }}>{p.difficulty} • +{p.xp} XP</div>
                        </div>
                        <span>→</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="glass-panel" style={{ padding: '24px', textAlign: 'center' }}>
                  <h3 style={{ fontSize: '1.3rem', fontWeight: 800 }}>{activePuzzle.title}</h3>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', margin: '8px 0 16px' }}>{activePuzzle.objective}</p>

                  <div style={{ perspective: '800px', margin: '0 auto 20px', maxWidth: '320px' }}>
                    <div className="board-3d-base">
                      <div className="classic-board-grid size-3">
                        {puzzleBoard.map((c, i) => (
                          <div key={i} className={`grid-cell-3d ${c ? 'occupied' : ''}`} onClick={() => handlePuzzleCell(i)}>
                            {c && <span className={c === 'X' ? 'neon-tube-x' : 'neon-tube-o'}>{c}</span>}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
                    <button className="btn-3d" onClick={() => showToast('Puzzle Hint', activePuzzle.hint)}>💡 Need Hint?</button>
                    <button className="btn-3d" onClick={() => { setPuzzleBoard([...activePuzzle.initial]); setPuzzleStatus('playing'); SoundManager.playClick(); }}>↺ Reset</button>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* ==============================================================================
             VIEW 7: SETTINGS & THEMES
             ============================================================================== */}
          {view === 'settings' && (
            <main style={{ maxWidth: '720px', margin: '0 auto' }}>
              <h2 style={{ fontSize: '1.8rem', fontWeight: 800, marginBottom: '16px' }}>Settings & Customization</h2>

              <div className="glass-panel" style={{ padding: '24px', marginBottom: '20px' }}>
                <h3 style={{ fontSize: '1.15rem', fontWeight: 700, marginBottom: '12px' }}>3D Camera & Perspectives</h3>
                <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                  <button className={`btn-3d ${view3D ? 'btn-3d-primary' : ''}`} onClick={() => !view3D && toggle3DView()}>
                    🎲 3D Perspective Tilt View (Default)
                  </button>
                  <button className={`btn-3d ${!view3D ? 'btn-3d-primary' : ''}`} onClick={() => view3D && toggle3DView()}>
                    📐 2D Top-Down Flat View
                  </button>
                </div>
              </div>

              <div className="glass-panel" style={{ padding: '24px', marginBottom: '20px' }}>
                <h3 style={{ fontSize: '1.15rem', fontWeight: 700, marginBottom: '12px' }}>Select Visual Theme (7 Curated Palettes)</h3>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(130px, 1fr))', gap: '10px' }}>
                  {[
                    { id: 'midnight_neon', label: 'Midnight Neon' },
                    { id: 'minimal_light', label: 'Minimal Light' },
                    { id: 'cyberpunk', label: 'Cyberpunk' },
                    { id: 'retro_arcade', label: 'Retro Arcade' },
                    { id: 'cosmic_space', label: 'Cosmic Space' },
                    { id: 'nature', label: 'Nature Sage' },
                    { id: 'monochrome', label: 'Monochrome' },
                  ].map(t => (
                    <button
                      key={t.id}
                      className={`btn-3d ${theme === t.id ? 'btn-3d-primary' : ''}`}
                      onClick={() => changeTheme(t.id)}
                    >
                      {t.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="glass-panel" style={{ padding: '24px', marginBottom: '20px' }}>
                <h3 style={{ fontSize: '1.15rem', fontWeight: 700, marginBottom: '12px' }}>AI Default Difficulty</h3>
                <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                  {['easy', 'medium', 'hard', 'impossible'].map(d => (
                    <button
                      key={d}
                      className={`btn-3d ${aiDiff === d ? 'btn-3d-primary' : ''}`}
                      style={{ textTransform: 'capitalize' }}
                      onClick={() => { setAiDiff(d); SoundManager.playClick(); showToast('AI Difficulty', `Default set to ${d.toUpperCase()}`); }}
                    >
                      {d}
                    </button>
                  ))}
                </div>
              </div>

              <div className="glass-panel" style={{ padding: '24px' }}>
                <h3 style={{ fontSize: '1.15rem', fontWeight: 700, marginBottom: '12px' }}>Audio Sound Synthesizer</h3>
                <button
                  className="btn-3d"
                  onClick={() => {
                    SoundManager.isMuted = !SoundManager.isMuted;
                    showToast('Sound Mute', SoundManager.isMuted ? 'Audio Muted' : 'Audio Unmuted');
                  }}
                >
                  {SoundManager.isMuted ? '🔇 Audio is Muted (Click to Unmute)' : '🔊 Audio is Active (Click to Mute)'}
                </button>
              </div>
            </main>
          )}

          {/* ==============================================================================
             VIEW 8: QA AUDIT SUITE
             ============================================================================== */}
          {view === 'audit' && (
            <main style={{ maxWidth: '820px', margin: '0 auto' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px', flexWrap: 'wrap', gap: '12px' }}>
                <div>
                  <h2 style={{ fontSize: '1.8rem', fontWeight: 800 }}>QA Software Verification Auditor</h2>
                  <p style={{ color: 'var(--text-muted)' }}>Executes live assertions against core rules, minimax perfection, and multiplayer room protocols.</p>
                </div>
                <button className="btn-3d btn-3d-primary" onClick={runFullAudit} disabled={isAuditing}>
                  {isAuditing ? 'Auditing...' : '▶ Run Verification'}
                </button>
              </div>

              <div className="glass-panel" style={{ padding: '20px' }}>
                {auditResults.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '30px', color: 'var(--text-muted)' }}>
                    Click "Run Verification" above to test all system invariants.
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {auditResults.map((r, i) => (
                      <div
                        key={i}
                        style={{
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'space-between',
                          padding: '12px 16px',
                          background: 'rgba(255, 255, 255, 0.03)',
                          borderLeft: `4px solid ${r.passed ? 'var(--color-success)' : 'var(--color-danger)'}`,
                          borderRadius: '4px'
                        }}
                      >
                        <div>
                          <div style={{ fontWeight: 700, fontSize: '0.95rem' }}>{r.name}</div>
                          <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>{r.category} • {r.msg}</div>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                          <span style={{ fontSize: '0.75rem', fontFamily: 'var(--font-mono)', color: 'var(--text-muted)' }}>{r.ms}ms</span>
                          <span style={{ fontWeight: 800, color: r.passed ? 'var(--color-success)' : 'var(--color-danger)' }}>
                            {r.passed ? '✓ PASSED' : '✗ FAILED'}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>
          )}

          {/* Toast Notification Container */}
          <div className="toast-container">
            {toasts.map(t => (
              <div key={t.id} className="toast-card">
                <span style={{ fontSize: '1.2rem' }}>⚡</span>
                <div>
                  <div style={{ fontWeight: 700, fontSize: '0.85rem' }}>{t.title}</div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>{t.message}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
