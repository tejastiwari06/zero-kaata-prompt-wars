                    <button
                      key={d}
                      className={`btn-3d ${aiDiff === d ? 'btn-3d-primary' : ''}`}
                      style={{ textTransform: 'capitalize' }}
                      onClick={() => { setAiDiff(d); SoundManager.playClick(); showToast('AI Difficulty', `Default set to ${d.toUpperCase()}`); }}
                    >
                      {d}
                    </button>
                  ))}
                </div>
              </div>

              <div className="glass-panel" style={{ padding: '24px' }}>
                <h3 style={{ fontSize: '1.15rem', fontWeight: 700, marginBottom: '12px' }}>Audio Sound Synthesizer</h3>
                <button
                  className="btn-3d"
                  onClick={() => {
                    SoundManager.isMuted = !SoundManager.isMuted;
                    showToast('Sound Mute', SoundManager.isMuted ? 'Audio Muted' : 'Audio Unmuted');
                  }}
                >
                  {SoundManager.isMuted ? '🔇 Audio is Muted (Click to Unmute)' : '🔊 Audio is Active (Click to Mute)'}
                </button>
              </div>
            </main>
          )}

          {/* ==============================================================================
             VIEW 8: QA AUDIT SUITE
             ============================================================================== */}
          {view === 'audit' && (
            <main style={{ maxWidth: '820px', margin: '0 auto' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px', flexWrap: 'wrap', gap: '12px' }}>
                <div>
                  <h2 style={{ fontSize: '1.8rem', fontWeight: 800 }}>QA Software Verification Auditor</h2>
                  <p style={{ color: 'var(--text-muted)' }}>Executes live assertions against core rules, minimax perfection, and multiplayer room protocols.</p>
                </div>
                <button className="btn-3d btn-3d-primary" onClick={runFullAudit} disabled={isAuditing}>
                  {isAuditing ? 'Auditing...' : '▶ Run Verification'}
                </button>
              </div>

              <div className="glass-panel" style={{ padding: '20px' }}>
                {auditResults.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '30px', color: 'var(--text-muted)' }}>
                    Click "Run Verification" above to test all system invariants.
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {auditResults.map((r, i) => (
                      <div
                        key={i}
                        style={{
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'space-between',
                          padding: '12px 16px',
                          background: 'rgba(255, 255, 255, 0.03)',
                          borderLeft: `4px solid ${r.passed ? 'var(--color-success)' : 'var(--color-danger)'}`,
                          borderRadius: '4px'
                        }}
                      >
                        <div>
                          <div style={{ fontWeight: 700, fontSize: '0.95rem' }}>{r.name}</div>
                          <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>{r.category} • {r.msg}</div>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                          <span style={{ fontSize: '0.75rem', fontFamily: 'var(--font-mono)', color: 'var(--text-muted)' }}>{r.ms}ms</span>
                          <span style={{ fontWeight: 800, color: r.passed ? 'var(--color-success)' : 'var(--color-danger)' }}>
                            {r.passed ? '✓ PASSED' : '✗ FAILED'}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </main>
          )}

          {/* ==============================================================================
             MATCH SETUP DIALOG (ISSUES 2, 3, 4, 5 RESOLUTION)
             ============================================================================== */}
          {(showMatchSetupModal || showModeSelectModal) && (
            <div className="modal-backdrop" onClick={() => { setShowMatchSetupModal(false); setShowModeSelectModal(false); }}>
              <div className="modal-content glass-panel" onClick={e => e.stopPropagation()} style={{ maxWidth: '640px', padding: '30px' }}>
                {/* Header */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <span style={{ fontSize: '2rem' }}>{matchSetupConfig.mode === 'friend' ? '👥' : '🤖'}</span>
                    <div>
                      <h3 style={{ fontSize: '1.4rem', fontWeight: 900, margin: 0 }}>
                        {matchSetupConfig.mode === 'friend' ? 'Pass & Play: Friend Match Setup' : 'Aether AI: Match Setup'}
                      </h3>
                      <p style={{ fontSize: '0.82rem', color: 'var(--text-muted)', margin: '4px 0 0 0' }}>
                        Configure match rules and launch directly into the grid.
                      </p>
                    </div>
                  </div>
                  <button className="btn-3d" style={{ padding: '6px 12px' }} onClick={() => { setShowMatchSetupModal(false); setShowModeSelectModal(false); }}>✕</button>
                </div>

                {/* 1. Protocol Selection: Knowledge Battle vs Normal */}
                <div style={{ marginBottom: '20px' }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: 800, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '8px' }}>
                    1. Choose Gameplay Rule Set
                  </label>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '12px' }}>
                    {/* Knowledge Battle Option */}
                    <div
                      onClick={() => setMatchSetupConfig(c => ({ ...c, protocol: 'knowledge_battle' }))}
                      style={{
                        padding: '16px',
                        borderRadius: 'var(--radius-md)',
                        cursor: 'pointer',
                        background: matchSetupConfig.protocol === 'knowledge_battle' ? 'rgba(0, 243, 255, 0.1)' : 'rgba(255, 255, 255, 0.03)',
                        border: matchSetupConfig.protocol === 'knowledge_battle' ? '2px solid var(--color-primary)' : '1px solid var(--border-subtle)',
                        boxShadow: matchSetupConfig.protocol === 'knowledge_battle' ? '0 0 20px rgba(0, 243, 255, 0.25)' : 'none',
                        transition: 'all 0.2s ease',
                        position: 'relative'
                      }}
                    >
                      {matchSetupConfig.protocol === 'knowledge_battle' && (
                        <span style={{ position: 'absolute', top: '10px', right: '10px', background: 'var(--color-primary)', color: '#000', fontSize: '0.68rem', fontWeight: 900, padding: '2px 8px', borderRadius: '12px' }}>
                          ✓ SELECTED
                        </span>
                      )}
                      <div style={{ fontSize: '1.6rem', marginBottom: '6px' }}>🧠</div>
                      <div style={{ fontWeight: 800, fontSize: '1.05rem', marginBottom: '4px' }}>AI/ML Knowledge Battle</div>
                      <div style={{ fontSize: '0.74rem', color: 'var(--color-primary)', fontWeight: 700, marginBottom: '6px' }}>
                        Answer First. Play First. • 20s Timer
                      </div>
                      <p style={{ fontSize: '0.78rem', color: 'var(--text-muted)', margin: 0, lineHeight: 1.4 }}>
                        A technical AI/ML question spawns before every move. First correct answer earns the turn.
                      </p>
                    </div>

                    {/* Normal Tic-Tac-Toe Option */}
                    <div
                      onClick={() => setMatchSetupConfig(c => ({ ...c, protocol: 'normal' }))}
                      style={{
                        padding: '16px',
                        borderRadius: 'var(--radius-md)',
                        cursor: 'pointer',
                        background: matchSetupConfig.protocol === 'normal' ? 'rgba(255, 0, 128, 0.1)' : 'rgba(255, 255, 255, 0.03)',
                        border: matchSetupConfig.protocol === 'normal' ? '2px solid var(--color-secondary)' : '1px solid var(--border-subtle)',
                        boxShadow: matchSetupConfig.protocol === 'normal' ? '0 0 20px rgba(255, 0, 128, 0.25)' : 'none',
                        transition: 'all 0.2s ease',
                        position: 'relative'
                      }}
                    >
                      {matchSetupConfig.protocol === 'normal' && (
                        <span style={{ position: 'absolute', top: '10px', right: '10px', background: 'var(--color-secondary)', color: '#fff', fontSize: '0.68rem', fontWeight: 900, padding: '2px 8px', borderRadius: '12px' }}>
                          ✓ SELECTED
                        </span>
                      )}
                      <div style={{ fontSize: '1.6rem', marginBottom: '6px' }}>⚡</div>
                      <div style={{ fontWeight: 800, fontSize: '1.05rem', marginBottom: '4px' }}>Normal Tic-Tac-Toe</div>
                      <div style={{ fontSize: '0.74rem', color: 'var(--color-secondary)', fontWeight: 700, marginBottom: '6px' }}>
                        Classic Pure Strategy • No Questions
                      </div>
                      <p style={{ fontSize: '0.78rem', color: 'var(--text-muted)', margin: 0, lineHeight: 1.4 }}>
                        Standard turn alternation (X then O). Rapid moves with zero question pauses.
                      </p>
                    </div>
                  </div>
                </div>

                {/* 2. Specific Configuration per Mode */}
                {matchSetupConfig.mode === 'friend' ? (
                  /* Friend Match: Player Names Configuration */
                  <div style={{ marginBottom: '20px' }}>
                    <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: 800, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '8px' }}>
                      2. Configure Player Names
                    </label>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                      <div>
                        <label style={{ display: 'block', fontSize: '0.78rem', color: 'var(--color-primary)', fontWeight: 700, marginBottom: '6px' }}>
                          Player 1 (X)
                        </label>
                        <input
                          type="text"
                          className="auth-input"
                          value={matchSetupConfig.p1Name}
                          onChange={e => setMatchSetupConfig(c => ({ ...c, p1Name: e.target.value }))}
                          placeholder="Player 1"
                        />
                      </div>
                      <div>
                        <label style={{ display: 'block', fontSize: '0.78rem', color: 'var(--color-secondary)', fontWeight: 700, marginBottom: '6px' }}>
                          Player 2 (O)
                        </label>
                        <input
                          type="text"
                          className="auth-input"
                          value={matchSetupConfig.p2Name}
                          onChange={e => setMatchSetupConfig(c => ({ ...c, p2Name: e.target.value }))}
                          placeholder="Player 2"
                        />
                      </div>
                    </div>
                  </div>
                ) : (
                  /* AI Match: AI Difficulty Configuration */
                  <div style={{ marginBottom: '20px' }}>
                    <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: 800, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '8px' }}>
                      2. Select AI Difficulty
                    </label>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '10px' }}>
                      {[
                        { id: 'easy', label: 'Easy', emoji: '🌱' },
                        { id: 'medium', label: 'Medium', emoji: '⚔️' },
                        { id: 'hard', label: 'Hard', emoji: '🔥' },
                        { id: 'impossible', label: 'Impossible', emoji: '💀' }
                      ].map(d => (
                        <button
                          key={d.id}
                          type="button"
                          className={`btn-3d ${matchSetupConfig.diff === d.id ? 'btn-3d-primary' : ''}`}
                          style={{ padding: '10px 8px', fontSize: '0.85rem', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px' }}
                          onClick={() => setMatchSetupConfig(c => ({ ...c, diff: d.id }))}
                        >
                          <span>{d.emoji}</span>
                          <span>{d.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* 3. Grid Size Selector */}
                <div style={{ marginBottom: '24px' }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: 800, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '8px' }}>
                    3. Grid Board Size
                  </label>
                  <div style={{ display: 'flex', gap: '10px' }}>
                    {[
                      { size: 3, label: '3x3 Classic' },
                      { size: 4, label: '4x4 Extended' },
                      { size: 5, label: '5x5 Grid' }
                    ].map(g => (
                      <button
                        key={g.size}
                        type="button"
                        className={`btn-3d ${matchSetupConfig.size === g.size ? 'btn-3d-secondary' : ''}`}
                        style={{ flex: 1, padding: '10px', fontSize: '0.88rem' }}
                        onClick={() => setMatchSetupConfig(c => ({ ...c, size: g.size }))}
                      >
                        {g.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Action Buttons */}
                <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', borderTop: '1px solid var(--border-subtle)', paddingTop: '18px' }}>
                  <button className="btn-3d" style={{ padding: '12px 20px' }} onClick={() => { setShowMatchSetupModal(false); setShowModeSelectModal(false); }}>
                    Cancel
                  </button>
                  <button
                    className="btn-3d btn-3d-primary"
                    style={{ padding: '12px 32px', fontSize: '1.05rem', fontWeight: 900 }}
                    onClick={launchConfiguredMatch}
                  >
                    {matchSetupConfig.mode === 'friend' ? '⚔️ Start Friend Match' : '🤖 Start AI Match'} ➔
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==============================================================================
             AUTHENTICATION MODAL (SIGN IN / REGISTER / GUEST)
             ============================================================================== */}
          {showAuthModal && (
            <div className="modal-backdrop" onClick={() => setShowAuthModal(false)}>
              <div className="modal-content glass-panel" onClick={e => e.stopPropagation()} style={{ maxWidth: '440px', padding: '32px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                    <span style={{ fontSize: '1.4rem' }}>🔐</span>
                    <h3 style={{ fontSize: '1.3rem', fontWeight: 900 }}>
                      {authTab === 'login' ? 'Player Sign In' : 'Create Player Account'}
                    </h3>
                  </div>
                  <button className="btn-3d" style={{ padding: '4px 10px' }} onClick={() => setShowAuthModal(false)}>✕</button>
                </div>

                {/* Tabs */}
                <div style={{ display: 'flex', gap: '8px', marginBottom: '18px', borderBottom: '1px solid var(--border-subtle)', paddingBottom: '8px' }}>
                  <button
                    type="button"
                    className={`btn-3d ${authTab === 'login' ? 'btn-3d-primary' : ''}`}
                    style={{ flex: 1, padding: '8px' }}
                    onClick={() => { setAuthTab('login'); setAuthError(''); setShowPassword(false); setShowConfirmPassword(false); SoundManager.playClick(); }}
                  >
                    Sign In
                  </button>
                  <button
                    type="button"
                    className={`btn-3d ${authTab === 'register' ? 'btn-3d-primary' : ''}`}
                    style={{ flex: 1, padding: '8px' }}
                    onClick={() => { setAuthTab('register'); setAuthError(''); setShowPassword(false); setShowConfirmPassword(false); SoundManager.playClick(); }}
                  >
                    Register
                  </button>
                </div>

                {authError && (
                  <div style={{ background: 'rgba(255, 51, 102, 0.15)', border: '1px solid var(--color-danger)', color: '#ff6688', padding: '10px 14px', borderRadius: 'var(--radius-sm)', fontSize: '0.85rem', marginBottom: '16px' }}>
                    ⚠️ {authError}
                  </div>
                )}

                <form onSubmit={authTab === 'login' ? handleAuthLogin : handleAuthRegister}>
                  <div style={{ marginBottom: '14px' }}>
                    <label style={{ display: 'block', fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '6px' }}>Username</label>
                    <input
                      type="text"
                      className="auth-input"
                      placeholder="e.g. NeoCoder"
                      value={authForm.username}
                      onChange={e => setAuthForm(prev => ({ ...prev, username: e.target.value }))}
                      required
                      autoFocus
                    />
                  </div>

                  <div style={{ marginBottom: '14px' }}>
                    <label style={{ display: 'block', fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '6px' }}>Password</label>
                    <div style={{ position: 'relative' }}>
                      <input
                        type={showPassword ? 'text' : 'password'}
                        className="auth-input"
                        style={{ paddingRight: '44px' }}
                        placeholder="••••••••"
                        value={authForm.password}
                        onChange={e => setAuthForm(prev => ({ ...prev, password: e.target.value }))}
                        required
                      />
                      <button
                        type="button"
                        aria-label={showPassword ? 'Hide password' : 'Show password'}
                        title={showPassword ? 'Hide password' : 'Show password'}
                        onClick={(e) => { e.preventDefault(); setShowPassword(prev => !prev); }}
                        style={{
                          position: 'absolute',
                          right: '10px',
                          top: '50%',
                          transform: 'translateY(-50%)',
                          background: 'transparent',
                          border: 'none',
                          color: showPassword ? 'var(--color-primary)' : 'var(--text-muted)',
                          cursor: 'pointer',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center',
                          padding: '6px',
                          borderRadius: '4px',
                          transition: 'color 0.2s, transform 0.15s'
                        }}
                      >
                        {showPassword ? (
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                          </svg>
                        ) : (
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                          </svg>
                        )}
                      </button>
                    </div>
                  </div>

                  {authTab === 'register' && (
                    <div style={{ marginBottom: '18px' }}>
                      <label style={{ display: 'block', fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '6px' }}>Confirm Password</label>
                      <div style={{ position: 'relative' }}>
                        <input
                          type={showConfirmPassword ? 'text' : 'password'}
                          className="auth-input"
                          style={{ paddingRight: '44px' }}
                          placeholder="••••••••"
                          value={authForm.confirmPassword}
                          onChange={e => setAuthForm(prev => ({ ...prev, confirmPassword: e.target.value }))}
                          required
                        />
                        <button
                          type="button"
                          aria-label={showConfirmPassword ? 'Hide password' : 'Show password'}
                          title={showConfirmPassword ? 'Hide password' : 'Show password'}
                          onClick={(e) => { e.preventDefault(); setShowConfirmPassword(prev => !prev); }}
                          style={{
                            position: 'absolute',
                            right: '10px',
                            top: '50%',
                            transform: 'translateY(-50%)',
                            background: 'transparent',
                            border: 'none',
                            color: showConfirmPassword ? 'var(--color-primary)' : 'var(--text-muted)',
                            cursor: 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            padding: '6px',
                            borderRadius: '4px',
                            transition: 'color 0.2s, transform 0.15s'
                          }}
                        >
                          {showConfirmPassword ? (
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                              <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                          ) : (
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                              <circle cx="12" cy="12" r="3" />
                            </svg>
                          )}
                        </button>
                      </div>
                    </div>
                  )}

                  <button
                    type="submit"
                    className="btn-3d btn-3d-primary"
                    style={{ width: '100%', padding: '12px', fontSize: '1rem', fontWeight: 800, marginTop: '8px' }}
                  >
                    {authTab === 'login' ? 'Sign In to Account' : 'Create New Account'}
                  </button>
                </form>

                <div style={{ textAlign: 'center', marginTop: '16px', paddingTop: '14px', borderTop: '1px solid var(--border-subtle)' }}>
                  <button
                    type="button"
                    className="btn-3d"
                    style={{ fontSize: '0.8rem', padding: '6px 14px', background: 'transparent' }}
                    onClick={() => {
                      setShowAuthModal(false);
                      showToast('Guest Session', 'Playing in guest sandbox mode.');
                    }}
                  >
                    Continue as Guest (No Account)
                  </button>
                  <p style={{ fontSize: '0.72rem', color: 'var(--text-muted)', marginTop: '8px', lineHeight: 1.3 }}>
                    🔒 Client-side cryptographic hashing. Each account has isolated storage for stats, achievements, and battle history.
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification Container */}
          <div className="toast-container">
            {toasts.map(t => (
              <div key={t.id} className="toast-card">
                <span style={{ fontSize: '1.2rem' }}>⚡</span>
                <div>
                  <div style={{ fontWeight: 700, fontSize: '0.85rem' }}>{t.title}</div>
                  <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>{t.message}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
